<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向 C · 仪表盘 / 场边读数器</title>
<style>
/* ============================================================
   方向 C — INSTRUMENT / 场边读数器
   设计逻辑：这不是"网页"，是一台放在场边的测量仪器。
   - 使用场景决定一切：手机架在场边，人站在 2 米外瞥一眼
   - 所以数字要大到不礼貌，信息层级要一刀切开
   - 中性石墨底（不是黑、不是荧光），唯一彩色是两块"队伍识别条"
   - 关键签名：比分外一圈极细的刻度环，像精密仪表
   - 刻意保持浅色系选择权：这里给的是"中性灰 + 一处克制彩"
   ============================================================ */
:root{
  --void:#101113;
  --plate:#17191C;
  --plate-2:#1D2024;
  --edge:#2A2E33;
  --edge-2:#3A4046;

  --fg:#F2F4F6;
  --fg-2:#9BA3AC;
  --fg-3:#6C757E;

  --a:#E1554A;          /* 甲：信号红 */
  --a-dim:rgba(225,85,74,.13);
  --b:#3E8FD9;          /* 乙：仪表蓝 */
  --b-dim:rgba(62,143,217,.13);

  --dial:#C8CDD3;       /* 刻度环：中性灰白，不是彩色 */
  --amber:#E0A33E;      /* 仅用于"进行中"状态，面积极小 */

  --mono:"SF Mono","Roboto Mono",ui-monospace,Consolas,monospace;
  --sans:"Bahnschrift","Segoe UI Variable Display","Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{
  background:#08090A;color:var(--fg);font-family:var(--sans);
  min-height:100vh;display:flex;justify-content:center;padding:0 0 40px;
}
.phone{
  width:100%;max-width:420px;min-height:100vh;position:relative;
  background:var(--void);
  border-left:1px solid var(--edge);border-right:1px solid var(--edge);
}

/* ---------- 顶栏：极窄，只留必要 ---------- */
.hud{
  height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--edge);
  background:rgba(16,17,19,.9);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:10;
}
.hud-id{
  font-size:10px;letter-spacing:.22em;color:var(--fg-3);text-transform:uppercase;
}
.hud-id b{color:var(--fg);font-weight:600}
.hud-dot{
  width:6px;height:6px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 0 3px rgba(224,163,62,.16);
}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hud-time{
  font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;
  color:var(--fg);letter-spacing:.01em;
}
.hud-time.paused{color:var(--fg-3)}
.hud-btn{
  width:30px;height:30px;display:grid;place-items:center;background:none;border:0;
  border-radius:3px;color:var(--fg-2);cursor:pointer;transition:.16s;
}
.hud-btn:hover{background:var(--plate-2);color:var(--fg)}
.hud-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 双读数：这台仪器的核心 ---------- */
.readout{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--edge);
  border-bottom:1px solid var(--edge);
}
.pane{
  background:var(--void);padding:24px 14px 20px;
  display:flex;flex-direction:column;align-items:center;position:relative;
}
/* 队伍识别条：顶部一条 3px 彩带，这是界面里几乎唯一的彩色 */
.pane::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
}
.pane.a::before{background:var(--a)}
.pane.b::before{background:var(--b)}
.pane.a{background:linear-gradient(180deg,var(--a-dim),var(--void) 42%)}
.pane.b{background:linear-gradient(180deg,var(--b-dim),var(--void) 42%)}

.pane-name{
  font-size:13.5px;letter-spacing:.05em;color:var(--fg-2);
  margin-bottom:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pane-meta{
  font-size:9.5px;letter-spacing:.16em;color:var(--fg-3);text-transform:uppercase;
  margin-bottom:14px;display:flex;align-items:center;gap:5px;
}
.pane.a .serve{color:var(--a)}
.pane.b .serve{color:var(--b)}
.serve i{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}

/* 刻度环：签名的精密仪表感。用 conic-gradient 画极细刻度 */
.dial{
  position:relative;width:126px;height:126px;display:grid;place-items:center;
}
.dial::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,
    var(--edge-2) 0deg 1.1deg, transparent 1.1deg 9deg,
    var(--edge-2) 9deg 10.1deg, transparent 10.1deg 18deg,
    var(--edge-2) 18deg 19.1deg, transparent 19.1deg 27deg,
    var(--edge-2) 27deg 28.1deg, transparent 28.1deg 36deg,
    var(--edge-2) 36deg 37.1deg, transparent 37.1deg 45deg,
    var(--edge-2) 45deg 46.1deg, transparent 46.1deg 54deg,
    var(--edge-2) 54deg 55.1deg, transparent 55.1deg 63deg,
    var(--edge-2) 63deg 64.1deg, transparent 64.1deg 72deg,
    var(--edge-2) 72deg 73.1deg, transparent 73.1deg 81deg,
    var(--edge-2) 81deg 82.1deg, transparent 82.1deg 90deg,
    var(--edge-2) 90deg 91.1deg, transparent 91.1deg 99deg,
    var(--edge-2) 99deg 100.1deg, transparent 100.1deg 108deg,
    var(--edge-2) 108deg 109.1deg, transparent 109.1deg 117deg,
    var(--edge-2) 117deg 118.1deg, transparent 118.1deg 126deg,
    var(--edge-2) 126deg 127.1deg, transparent 127.1deg 135deg,
    var(--edge-2) 135deg 136.1deg, transparent 136.1deg 144deg,
    var(--edge-2) 144deg 145.1deg, transparent 145.1deg 153deg,
    var(--edge-2) 153deg 154.1deg, transparent 154.1deg 162deg,
    var(--edge-2) 162deg 163.1deg, transparent 163.1deg 171deg,
    var(--edge-2) 171deg 172.1deg, transparent 172.1deg 180deg,
    var(--edge-2) 180deg 181.1deg, transparent 181.1deg 189deg,
    var(--edge-2) 189deg 190.1deg, transparent 190.1deg 198deg,
    var(--edge-2) 198deg 199.1deg, transparent 199.1deg 207deg,
    var(--edge-2) 207deg 208.1deg, transparent 208.1deg 216deg,
    var(--edge-2) 216deg 217.1deg, transparent 217.1deg 225deg,
    var(--edge-2) 225deg 226.1deg, transparent 226.1deg 234deg,
    var(--edge-2) 234deg 235.1deg, transparent 235.1deg 243deg,
    var(--edge-2) 243deg 244.1deg, transparent 244.1deg 252deg,
    var(--edge-2) 252deg 253.1deg, transparent 253.1deg 261deg,
    var(--edge-2) 261deg 262.1deg, transparent 262.1deg 270deg,
    var(--edge-2) 270deg 271.1deg, transparent 271.1deg 279deg,
    var(--edge-2) 279deg 280.1deg, transparent 280.1deg 288deg,
    var(--edge-2) 288deg 289.1deg, transparent 289.1deg 297deg,
    var(--edge-2) 297deg 298.1deg, transparent 298.1deg 306deg,
    var(--edge-2) 306deg 307.1deg, transparent 307.1deg 315deg,
    var(--edge-2) 315deg 316.1deg, transparent 316.1deg 324deg,
    var(--edge-2) 324deg 325.1deg, transparent 325.1deg 333deg,
    var(--edge-2) 333deg 334.1deg, transparent 334.1deg 342deg,
    var(--edge-2) 342deg 343.1deg, transparent 343.1deg 351deg,
    var(--edge-2) 351deg 352.1deg, transparent 352.1deg 360deg);
  -webkit-mask:radial-gradient(circle, transparent 55px, #000 56px, #000 62px, transparent 63px);
  mask:radial-gradient(circle, transparent 55px, #000 56px, #000 62px, transparent 63px);
  opacity:.5;
}
.dial::after{
  content:"";position:absolute;inset:8px;border-radius:50%;
  border:1px solid var(--edge);
}
.big{
  font-family:var(--mono);font-size:70px;line-height:.85;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.045em;position:relative;
}
.pane.a .big{color:var(--fg)}
.pane.b .big{color:var(--fg)}
/* 领先方：刻度环转为亮色 + 数字满色；落后方整体降调 */
.pane:not(.leading) .dial{opacity:.62}
.pane.leading .dial::before{opacity:.95;background:conic-gradient(from 0deg,var(--dial) 0deg 1.4deg,transparent 1.4deg 9deg,var(--dial) 9deg 10.4deg,transparent 10.4deg 18deg,var(--dial) 18deg 19.4deg,transparent 19.4deg 27deg,var(--dial) 27deg 28.4deg,transparent 28.4deg 36deg,var(--dial) 36deg 37.4deg,transparent 37.4deg 45deg,var(--dial) 45deg 46.4deg,transparent 46.4deg 54deg,var(--dial) 54deg 55.4deg,transparent 55.4deg 63deg,var(--dial) 63deg 64.4deg,transparent 64.4deg 72deg,var(--dial) 72deg 73.4deg,transparent 73.4deg 81deg,var(--dial) 81deg 82.4deg,transparent 82.4deg 90deg,var(--dial) 90deg 91.4deg,transparent 91.4deg 99deg,var(--dial) 99deg 100.4deg,transparent 100.4deg 108deg,var(--dial) 108deg 109.4deg,transparent 109.4deg 117deg,var(--dial) 117deg 118.4deg,transparent 118.4deg 126deg,var(--dial) 126deg 127.4deg,transparent 127.4deg 135deg,var(--dial) 135deg 136.4deg,transparent 136.4deg 144deg,var(--dial) 144deg 145.4deg,transparent 145.4deg 153deg,var(--dial) 153deg 154.4deg,transparent 154.4deg 162deg,var(--dial) 162deg 163.4deg,transparent 163.4deg 171deg,var(--dial) 171deg 172.4deg,transparent 172.4deg 180deg,var(--dial) 180deg 181.4deg,transparent 181.4deg 189deg,var(--dial) 189deg 190.4deg,transparent 190.4deg 198deg,var(--dial) 198deg 199.4deg,transparent 199.4deg 207deg,var(--dial) 207deg 208.4deg,transparent 208.4deg 216deg,var(--dial) 216deg 217.4deg,transparent 217.4deg 225deg,var(--dial) 225deg 226.4deg,transparent 226.4deg 234deg,var(--dial) 234deg 235.4deg,transparent 235.4deg 243deg,var(--dial) 243deg 244.4deg,transparent 244.4deg 252deg,var(--dial) 252deg 253.4deg,transparent 253.4deg 261deg,var(--dial) 261deg 262.4deg,transparent 262.4deg 270deg,var(--dial) 270deg 271.4deg,transparent 271.4deg 279deg,var(--dial) 279deg 280.4deg,transparent 280.4deg 288deg,var(--dial) 288deg 289.4deg,transparent 289.4deg 297deg,var(--dial) 297deg 298.4deg,transparent 298.4deg 306deg,var(--dial) 306deg 307.4deg,transparent 307.4deg 315deg,var(--dial) 315deg 316.4deg,transparent 316.4deg 324deg,var(--dial) 324deg 325.4deg,transparent 325.4deg 333deg,var(--dial) 333deg 334.4deg,transparent 334.4deg 342deg,var(--dial) 342deg 343.4deg,transparent 343.4deg 351deg,var(--dial) 351deg 352.4deg,transparent 352.4deg 360deg)}
.pane:not(.leading) .big{color:var(--fg-2)}
.pane:not(.leading) .pane-name{color:var(--fg-3)}

/* 局分：条形刻度，比圆点更"仪器" */
.marks{display:flex;gap:4px;margin-top:14px}
.mk{width:20px;height:3px;background:var(--edge-2);border-radius:1px}
.pane.a .mk.won{background:var(--a)}
.pane.b .mk.won{background:var(--b)}

/* ---------- 大得分键：单手、盲按、2 米外可见 ---------- */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--edge);
  border-bottom:1px solid var(--edge)}
.pad{
  border:0;background:var(--plate);color:var(--fg);cursor:pointer;
  padding:26px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  font-family:var(--sans);font-size:15px;letter-spacing:.06em;
  transition:background .14s;position:relative;
}
.pad:hover{background:var(--plate-2)}
.pad:active{background:#26292E}
.pad .plus{
  font-family:var(--mono);font-size:22px;line-height:1;color:var(--fg-3);
  transition:color .14s,transform .14s;
}
.pad:active .plus{transform:scale(1.14)}
.pad.a:active .plus{color:var(--a)}
.pad.b:active .plus{color:var(--b)}
.pad .lbl{font-size:10px;letter-spacing:.2em;color:var(--fg-3);text-transform:uppercase}

/* ---------- 工具行 ---------- */
.tools{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;
  background:var(--edge);border-bottom:1px solid var(--edge);
}
.tool{
  background:var(--void);border:0;color:var(--fg-2);cursor:pointer;
  padding:13px 8px;font-size:11.5px;font-family:var(--sans);
  letter-spacing:.06em;transition:.16s;
}
.tool:hover{background:var(--plate);color:var(--fg)}

/* ---------- 流水：紧凑，一行一分，像仪器日志 ---------- */
.log{padding:20px 16px 0}
.log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.log-head h2{font-size:10px;letter-spacing:.2em;color:var(--fg-3);
  text-transform:uppercase;font-weight:600}
.log-head em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}
.log-box{border:1px solid var(--edge);background:var(--plate)}
.log-row{
  display:grid;grid-template-columns:30px 1fr auto;align-items:center;
  padding:9px 12px;border-bottom:1px solid var(--edge);font-size:12.5px;
}
.log-row:last-child{border-bottom:0}
.log-row .no{font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}
.log-row .who{display:flex;align-items:center;gap:7px;color:var(--fg-2)}
.log-row .who i{width:3px;height:12px;border-radius:1px}
.log-row.a .who i{background:var(--a)}
.log-row.b .who i{background:var(--b)}
.log-row .pts{font-family:var(--mono);font-size:12px;color:var(--fg-3);
  font-variant-numeric:tabular-nums}
.log-row .pts b{color:var(--fg);font-weight:600}
.log-row.fresh{background:var(--plate-2)}
.log-row.fresh .who{color:var(--fg)}

.foot{padding:18px 16px 30px;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{
  padding:14px;border:1px solid var(--edge-2);background:none;color:var(--fg-2);
  font-family:var(--sans);font-size:13px;letter-spacing:.06em;cursor:pointer;
  transition:.16s;
}
.btn:hover{border-color:var(--fg-3);color:var(--fg)}
.btn.primary{background:var(--fg);border-color:var(--fg);color:#0B0C0D;font-weight:600}
.btn.primary:hover{background:#fff}

.note{
  margin:0 16px 30px;padding:14px;background:var(--plate);
  border:1px solid var(--edge);border-left:3px solid var(--a);
  font-size:11.5px;line-height:1.8;color:var(--fg-2);
}
.note b{color:var(--fg)}
</style>
</head>
<body>
<div class="phone">

  <div class="hud">
    <span class="hud-dot"></span>
    <span class="hud-id">第 <b>2</b> 局 · 21 分制</span>
    <div class="hud-right">
      <span class="hud-time">23:14</span>
      <button class="hud-btn" aria-label="数据"><svg viewBox="0 0 24 24"><path d="M4 19.6h16"/><path d="M7.4 19.6v-5.8"/><path d="M12 19.6V7.6"/><path d="M16.6 19.6v-9"/></svg></button>
      <button class="hud-btn" aria-label="分享"><svg viewBox="0 0 24 24"><path d="M12 15.2V3.8"/><path d="M8 7.6 12 3.6l4 4"/><path d="M5 13.6v5.6h14v-5.6"/></svg></button>
    </div>
  </div>

  <div class="readout">
    <div class="pane a leading">
      <div class="pane-name">陈骁</div>
      <div class="pane-meta"><span class="serve"><i></i>发球</span></div>
      <div class="dial"><div class="big">14</div></div>
      <div class="marks"><span class="mk won"></span><span class="mk"></span></div>
    </div>
    <div class="pane b">
      <div class="pane-name">林知远</div>
      <div class="pane-meta">接发</div>
      <div class="dial"><div class="big">11</div></div>
      <div class="marks"><span class="mk"></span><span class="mk"></span></div>
    </div>
  </div>

  <div class="pads">
    <button class="pad a"><span class="plus">+</span>甲队得分<span class="lbl">A</span></button>
    <button class="pad b"><span class="plus">+</span>乙队得分<span class="lbl">B</span></button>
  </div>

  <div class="tools">
    <button class="tool">暂停计时</button>
    <button class="tool">撤回一分</button>
    <button class="tool">重置本局</button>
  </div>

  <div class="log">
    <div class="log-head"><h2>得分记录</h2><em>06 条</em></div>
    <div class="log-box">
      <div class="log-row a fresh"><span class="no">06</span><span class="who"><i></i>陈骁</span><span class="pts">13 → <b>14</b></span></div>
      <div class="log-row b"><span class="no">05</span><span class="who"><i></i>林知远</span><span class="pts">10 → <b>11</b></span></div>
      <div class="log-row a"><span class="no">04</span><span class="who"><i></i>陈骁</span><span class="pts">12 → <b>13</b></span></div>
      <div class="log-row a"><span class="no">03</span><span class="who"><i></i>陈骁</span><span class="pts">11 → <b>12</b></span></div>
      <div class="log-row b"><span class="no">02</span><span class="who"><i></i>林知远</span><span class="pts">9 → <b>10</b></span></div>
    </div>
  </div>

  <div class="foot">
    <button class="btn">重置比赛</button>
    <button class="btn primary">保存本场</button>
  </div>

  <div class="note">
    <b>方向 C · 仪表读数器</b><br>
    从<b>使用场景</b>倒推设计：手机架在场边、人站 2 米外。所以数字做到 70px、
    得分键做大且能盲按、信息一刀切成"读数区 / 操作区 / 日志区"。
    签名是比分外那圈<b>精密刻度环</b>。底色是中性石墨（不是荧光黑），
    全屏彩色只有两条 3px 队伍识别条。
  </div>

</div>
</body>
</html>
