<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缇芥瘺鐞冩瀬閫熻鍒嗘澘 - 涓撲笟鐗?/title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        /* ================================================================
           璁捐浠ょ墝灞?鈥?娣辫壊婕旀挱瀹?/ 浣撹偛 HUD
           鍏ㄦ枃浠跺敮涓€鍏佽鍑虹幇瑁?#hex / rgba() 鐨勪綅缃€?
           缁勪欢灞傚彧鍏佽鍐?var(--*)锛岀姝㈣８鍊笺€?
           ================================================================ */
        :root {
            /* ---- 琛ㄩ潰锛堝喎涓€ф繁鑹诧紝涓嶇敤绾粦锛?--- */
            --c-bg: #0B0E11;          /* 椤甸潰鏈€娣卞眰 */
            --c-surface: #14181D;     /* 涓€绾э細鍗＄墖 / 闈㈡澘 */
            --c-surface-2: #1C222A;   /* 浜岀骇锛氭帶浠?/ 鎸夐挳搴?*/
            --c-surface-3: #262E38;   /* 涓夌骇锛歨over / 婵€娲?*/

            /* ---- 鍙戜笣绾匡紙鏇夸唬 border锛岄伩鍏嶅奖鍝嶇洅妯″瀷锛?--- */
            --c-line: #232A33;        /* 榛樿鍒嗛殧 */
            --c-line-strong: #38424F; /* 杈撳叆妗?/ 鎮仠 */

            /* ---- 鏂囨湰锛堜笉鐢ㄧ函鐧斤紝闄嶄綆鍒虹溂锛?--- */
            --c-text: #F2F5F8;        /* 涓?*/
            --c-text-2: #9AA6B4;      /* 娆★細鏍囩 / 璇存槑 / 鍗犱綅 */
            --c-text-3: #5F6B7A;      /* 寮憋細绂佺敤 / 寰敞 */

            /* ---- 闃熶紞鑹诧細鍏ㄥ簲鐢ㄥ敮涓€楂橀ケ鍜岃壊 ---- */
            --c-team-a: #FF4D5E;      /* A 闃?鐝婄憵绾?*/
            --c-team-b: #3D9BFF;      /* B 闃?澶╄摑 */
            --c-brand: #00E5A0;       /* 鍝佺墝 / 琛屽姩 / 杩涜涓?*/
            --c-brand-ink: #06281D;   /* 鍝佺墝鑹蹭笂鐨勬枃瀛?*/
            --c-gold: #FFC53D;        /* 鎴愬氨 / 濂栫墝 */

            /* ---- 璇箟 ---- */
            --c-success: #00E5A0;
            --c-warning: #FFB020;
            --c-danger: #FF4D5E;

            /* ---- 鎺掔増 ---- */
            --font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC',
                         'HarmonyOS Sans SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --font-num: 'Barlow Condensed', 'Oswald', 'Archivo Narrow',
                        'Arial Narrow', var(--font-sans);
            --fs-2xs: .625rem;  --fs-xs: .75rem;   --fs-sm: .8125rem;  --fs-md: .875rem;
            --fs-base: 1rem;    --fs-lg: 1.125rem; --fs-xl: 1.375rem;  --fs-2xl: 1.75rem;
            --fs-score: clamp(3.25rem, 13vw, 5.5rem);
            --fw-normal: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
            --tracking-tight: -.01em;
            --tracking-wide: .04em;

            /* ---- 绌洪棿锛?px 鍩洪锛?--- */
            --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
            --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

            /* ---- 鍦嗚 ---- */
            --r-sm: 6px;    /* 杈撳叆妗?/ chip / 灏忓窘绔?*/
            --r-md: 10px;   /* 鎸夐挳 / 灏忓崱 */
            --r-lg: 14px;   /* 鍗＄墖 / 闈㈡澘 */
            --r-xl: 20px;   /* 妯℃€?*/
            --r-full: 999px;

            /* ---- 楂樺害锛堟殫鑹蹭笅闃村奖闇€鏇撮噸鎵嶅彲瑙侊級---- */
            --e-1: 0 1px 2px rgba(0, 0, 0, .40);
            --e-2: 0 2px 8px rgba(0, 0, 0, .45);
            --e-3: 0 8px 24px rgba(0, 0, 0, .55);
            --e-4: 0 16px 48px rgba(0, 0, 0, .65);
            --line-1: inset 0 0 0 1px var(--c-line);
            --line-2: inset 0 0 0 1px var(--c-line-strong);

            /* ---- 鍔ㄦ晥 ---- */
            --dur-1: 120ms; --dur-2: 200ms; --dur-3: 320ms;
            --ease-out: cubic-bezier(.22, 1, .36, 1);
            --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

            /* ---- 灞傜骇 ---- */
            --z-sticky: 100; --z-overlay: 200; --z-modal: 300; --z-toast: 400;
        }

        /* ---- 鍩虹灞?reset ---- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 婊氬姩鏉＄粏鏍峰紡鍖栵紙涓嶅啀鍏ㄥ眬闅愯棌锛屼繚鐣欐粴鍔ㄧ嚎绱級 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--c-surface-3);
            border-radius: var(--r-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--c-line-strong);
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: var(--c-surface-3) transparent;
        }

        body {
            font-family: var(--font-sans);
            background: var(--c-bg);
            color: var(--c-text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 鏋佹贰鐨勯槦浼嶈壊姘涘洿鍏夛紙opacity 鈮?.06锛屼粎鏆楃ず婕旀挱瀹ょ伅鍏夛級 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(60rem 40rem at 12% -10%, rgba(255, 77, 94, 0.06) 0%, transparent 60%),
                radial-gradient(60rem 40rem at 88% -10%, rgba(61, 155, 255, 0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ---- 閫夋嫨涓庣劍鐐?---- */
        ::selection {
            background: rgba(0, 229, 160, 0.28);
            color: var(--c-text);
        }

        :focus-visible {
            outline: 2px solid var(--c-brand);
            outline-offset: 2px;
            border-radius: var(--r-sm);
        }

        /* ---- 鏁板瓧蹇呴』绛夊锛堟瘮鍒?9鈫?0 涓嶆姈鍔級---- */
        .score-number, .score-label, .timer-value, .games-won-dots,
        .stat-value, .stat-card-value, .leaderboard-score, .expense-amount,
        .ability-stat-value, [class*='number'], [class*='count'] {
            font-variant-numeric: tabular-nums;
            font-feature-settings: 'tnum' 1;
        }

        /* ---- 鍔ㄦ晥闄嶇骇 ---- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: var(--fs-2xl);
            font-weight: var(--fw-bold);
            margin-bottom: var(--sp-3);
            color: var(--c-text);
            letter-spacing: var(--tracking-tight);
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--c-brand);
            border-radius: var(--r-full);
        }

        .version-badge {
            display: inline-block;
            background: var(--c-surface-2);
            color: var(--c-text-2);
            box-shadow: var(--line-1);
            padding: 3px 10px;
            border-radius: var(--r-full);
            font-size: var(--fs-xs);
            font-weight: var(--fw-medium);
            margin-left: var(--sp-2);
            vertical-align: middle;
        }

        footer {
            text-align: center;
            padding: var(--sp-6) var(--sp-5);
            margin-top: var(--sp-5);
        }

        .footer-content {
            display: inline-flex;
            align-items: center;
            gap: var(--sp-2);
            padding: var(--sp-2) var(--sp-5);
            background: var(--c-surface);
            box-shadow: var(--line-1);
            border-radius: var(--r-full);
        }

        .footer-logo {
            font-size: var(--fs-base);
        }

        .footer-text {
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            color: var(--c-text-2);
        }

        .footer-divider {
            color: var(--c-text-3);
        }

        .footer-author {
            font-size: var(--fs-sm);
            font-weight: var(--fw-semibold);
            color: var(--c-text-2);
        }

        .screen {
            display: none;
            animation: fadeIn var(--dur-3) var(--ease-out);
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 椤甸潰鍒囨崲鍔ㄧ敾澧炲己 */
        .screen.fade-out {
            animation: fadeOut 0.2s ease forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* 绌虹姸鎬佷紭鍖?*/
        .empty-state-enhanced {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon-animated {
            font-size: 5rem;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(5deg); }
            75% { transform: translateY(-8px) rotate(-5deg); }
        }

        .empty-state-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0133A4;
            margin-bottom: 12px;
        }

        .empty-state-desc {
            font-size: 0.95rem;
            color: #6839E8;
            opacity: 0.7;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .empty-state-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #6839E8 0%, #8B5CF6 100%);
            color: white;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
        }

        .empty-state-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(104, 57, 232, 0.35);
        }

        /* 楠ㄦ灦灞忓姞杞芥晥鏋?*/
        .skeleton {
            background: linear-gradient(90deg, #F0EBFF 25%, #E8E0FF 50%, #F0EBFF 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            height: 100px;
            margin-bottom: 12px;
        }

        .skeleton-text {
            height: 16px;
            margin-bottom: 8px;
        }

        .skeleton-text.short {
            width: 60%;
        }

        /* 鍔犺浇鍔ㄧ敾 */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(104, 57, 232, 0.2);
            border-top-color: #6839E8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== 璁板垎鏉挎牱寮?==================== */
        /* ===== 3b 璁板垎鏉?===== */
        .scoreboard-wrapper {
            background: var(--c-surface);
            box-shadow: var(--line-1);
            border-radius: var(--r-xl);
            padding: var(--sp-6);
            margin-bottom: var(--sp-8);
            position: relative;
            overflow: hidden;
        }

        /* 椤堕儴 3px 鍝佺墝鑹叉潯 鈥?婕旀挱瀹よ鍒嗙墝鏍囪瘑 */
        .scoreboard-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--c-team-a), var(--c-brand) 50%, var(--c-team-b));
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--sp-3) var(--sp-4);
            background: var(--c-bg);
            border-radius: var(--r-md);
            margin-bottom: var(--sp-5);
        }

        .timer-display {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
        }

        .timer-icon {
            font-size: var(--fs-lg);
        }

        .timer-value {
            font-family: var(--font-num);
            font-size: var(--fs-xl);
            font-weight: var(--fw-semibold);
            color: var(--c-text);
            font-variant-numeric: tabular-nums;
        }

        .game-indicator {
            background: var(--c-surface-3);
            padding: var(--sp-2) var(--sp-4);
            border-radius: var(--r-full);
            font-weight: var(--fw-medium);
            color: var(--c-text-2);
            font-size: var(--fs-sm);
        }

        .games-score-display {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
        }

        .score-badge {
            min-width: 34px;
            height: 34px;
            padding: 0 var(--sp-1);
            background: var(--c-surface-2);
            box-shadow: var(--line-1);
            border-radius: var(--r-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-num);
            font-weight: var(--fw-bold);
            color: var(--c-text);
            font-size: var(--fs-lg);
            font-variant-numeric: tabular-nums;
        }

        #games-score-a { color: var(--c-team-a); }
        #games-score-b { color: var(--c-team-b); }

        .score-separator {
            color: var(--c-text-3);
            font-weight: var(--fw-medium);
        }

        .scoreboard-main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--sp-5);
            margin-bottom: var(--sp-5);
        }

        /* 响应式覆写已集中到文件末尾的 @media 区 */

        .team-section {
            flex: 1;
            text-align: center;
            max-width: 300px;
            background: var(--c-surface);
            box-shadow: var(--line-1);
            border-radius: var(--r-lg);
            padding: var(--sp-4);
            user-select: none;
        }

        /* 闃熶紞璇嗗埆锛氶《閮?3px 鑹叉潯锛堝彇浠ｆ暣鍦堢櫧杈?+ 鍋忕Щ鎶曞奖锛?*/
        .team-section.team-a {
            border-top: 3px solid var(--c-team-a);
        }

        .team-section.team-b {
            border-top: 3px solid var(--c-team-b);
        }

        .team-header {
            margin-bottom: var(--sp-4);
        }

        .team-avatar {
            width: 56px;
            height: 56px;
            background: var(--c-surface-2);
            box-shadow: var(--line-1);
            border-radius: var(--r-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--fs-2xl);
            margin: 0 auto var(--sp-2);
            cursor: pointer;
            transition: background var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
        }

        .team-avatar:hover {
            background: var(--c-surface-3);
            transform: scale(1.06);
        }

        .team-name-wrapper {
            margin-bottom: var(--sp-2);
        }

        .team-name-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--c-line);
            color: var(--c-text);
            font-size: var(--fs-lg);
            font-weight: var(--fw-semibold);
            text-align: center;
            width: 100%;
            padding: var(--sp-1) var(--sp-2);
        }

        .team-name-input:focus {
            outline: none;
            border-bottom-color: var(--c-brand);
        }

        .games-won-dots {
            display: flex;
            justify-content: center;
            gap: var(--sp-2);
            min-height: 10px;
            margin-top: var(--sp-2);
        }

        .game-dot {
            width: 10px;
            height: 10px;
            border-radius: var(--r-full);
            background: var(--c-surface-3);
            transition: background var(--dur-2) var(--ease-out);
        }

        .team-a .game-dot.won {
            background: var(--c-team-a);
        }

        .team-b .game-dot.won {
            background: var(--c-team-b);
        }

        /* 婕旀挱瀹よ鍒嗙墝鏄煩褰紝涓嶆槸鍦?*/
        .score-circle {
            width: clamp(120px, 34vw, 180px);
            aspect-ratio: 3 / 4;
            border-radius: var(--r-lg);
            background: var(--c-surface-2);
            box-shadow: var(--line-1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--sp-4);
            cursor: pointer;
            transition: background var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
            user-select: none;
        }

        .score-circle:hover {
            background: var(--c-surface-3);
            transform: scale(1.03);
        }

        .score-circle:active {
            transform: scale(0.98);
        }

        .score-number {
            font-family: var(--font-num);
            font-size: var(--fs-score);
            font-weight: var(--fw-bold);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: var(--tracking-tight);
        }

        .team-a .score-number { color: var(--c-team-a); }
        .team-b .score-number { color: var(--c-team-b); }

        .score-label {
            font-size: var(--fs-xs);
            color: var(--c-text-3);
            margin-top: var(--sp-1);
        }

        .score-buttons {
            display: flex;
            justify-content: center;
            gap: var(--sp-3);
        }

        .score-btn {
            width: 48px;
            height: 48px;
            border-radius: var(--r-md);
            border: none;
            font-family: var(--font-num);
            font-size: var(--fs-2xl);
            font-weight: var(--fw-bold);
            cursor: pointer;
            transition: background var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-btn.plus {
            background: var(--c-brand);
            color: var(--c-brand-ink);
        }

        .score-btn.plus:hover {
            background: #00FFB3;
            transform: scale(1.08);
        }

        .score-btn.minus {
            background: var(--c-surface-3);
            color: var(--c-text);
        }

        .score-btn.minus:hover {
            background: var(--c-line-strong);
            transform: scale(1.08);
        }

        .vs-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--sp-5) 0;
        }

        /* VS 鏀逛负灏忓窘绔狅紝鍒犻櫎澶у渾 + 鍙戝厜 */
        .vs-text {
            font-family: var(--font-num);
            font-size: var(--fs-lg);
            font-weight: var(--fw-bold);
            color: var(--c-text-2);
            letter-spacing: var(--tracking-wide);
            background: var(--c-surface-3);
            border-radius: var(--r-full);
            padding: var(--sp-1) var(--sp-3);
            margin-bottom: var(--sp-2);
        }

        .vs-line {
            width: 2px;
            flex: 1;
            min-height: 48px;
            background: var(--c-line);
        }

        .game-mode-section {

        /* ==================== 鏂版墜寮曞鏍峰紡 ==================== */
        .onboarding-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }

        .onboarding-overlay.fade-out {
            animation: fadeOut 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .onboarding-modal {
            background: white;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            animation: scaleIn 0.4s ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .onboarding-slides {
            position: relative;
            min-height: 200px;
        }

        .onboarding-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.4s ease;
        }

        .onboarding-slide.active {
            opacity: 1;
            transform: translateX(0);
        }

        .slide-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .slide-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0133A4;
            margin-bottom: 12px;
        }

        .slide-desc {
            font-size: 1rem;
            color: #6839E8;
            opacity: 0.8;
            line-height: 1.6;
        }

        .onboarding-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 30px 0;
        }

        .onboarding-dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(104, 57, 232, 0.2);
            transition: all 0.3s ease;
        }

        .onboarding-dots .dot.active {
            background: #6839E8;
            width: 30px;
            border-radius: 5px;
        }

        .onboarding-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .btn-skip {
            padding: 12px 24px;
            background: transparent;
            border: 2px solid rgba(104, 57, 232, 0.3);
            border-radius: 12px;
            color: #6839E8;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-skip:hover {
            background: rgba(104, 57, 232, 0.1);
        }

        .btn-next {
            flex: 1;
            padding: 12px 24px;
            background: linear-gradient(135deg, #6839E8 0%, #8B5CF6 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(104, 57, 232, 0.3);
        }

        /* ==================== 蹇嵎鎿嶄綔鏍峰紡 ==================== */
        .quick-actions-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .quick-actions-panel.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .quick-actions-content {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);

            transition: 0.3s;

            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;

        /* ==================== 搴嗙鍔ㄧ敾绯荤粺 ==================== */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            overflow: hidden;
        }

            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: fireworkExplode ease-out forwards;
        }

        @keyframes fireworkExplode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

            position: fixed;

            pointer-events: none;

        @keyframes bannerPop {
            0% {
                transform: translate(-50%, -50%) scale(0);

            50% {

            }
            100% {

            color: rgba(255, 255, 255, 0.4);
        }

        .share-card-footer {
            text-align: center;
            z-index: 1;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .share-card-date {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .share-card-duration {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
        }

        .share-card-highlights {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .share-card-highlight-tag {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .share-card-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .share-card-controls .btn-dark {
            background: #6839E8;
            color: #FFFFFF;
            border: 2px solid #6839E8;
        }

        .share-card-controls .btn-dark:hover {
            background: #5a2fd1;
            border-color: #5a2fd1;
        }

        .share-card-controls .btn-success {
            background: #27F05C;
            color: #FFFFFF;
            border: 2px solid #27F05C;
        }

        .share-card-controls .btn-success:hover {
            background: #1ed14d;
            border-color: #1ed14d;
        }

        .template-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }

        .template-btn {
            padding: 8px 16px;
            border: 2px solid #6839E8;
            background: white;
            color: #6839E8;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .template-btn:hover,
        .template-btn.active {
            background: #6839E8;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(104, 57, 232, 0.3);
        }

        /* ==================== 鎴愬氨绯荤粺鏍峰紡 ==================== */
        .achievement-badge {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.4);
            z-index: 10002;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: achievementSlideDown 0.5s ease-out forwards;
        }

        @keyframes achievementSlideDown {
            0% { transform: translateX(-50%) translateY(-100px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .achievement-icon {
            font-size: 2.5rem;
            animation: achievementPulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes achievementPulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        .achievement-text {
            text-align: left;
        }

        .achievement-title {
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 3px;
        }

        .achievement-desc {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .achievement-card {
            background: var(--c-surface);
            backdrop-filter: blur(20px);
            border-radius: var(--r-lg);
            padding: 20px;
            text-align: center;
            border: 2px solid var(--c-line);
            transition: all 0.3s ease;
        }

        .achievement-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(104, 57, 232, 0.2);
        }

        .achievement-card.locked {
            opacity: 0.5;
            filter: grayscale(100%);
        }

        .achievement-card.locked:hover {
            transform: none;
            filter: grayscale(70%);
        }

        .achievement-card-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .achievement-card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--c-brand);
            margin-bottom: 5px;
        }

        .achievement-card-desc {
            font-size: 0.85rem;
            color: var(--c-text-2);
            opacity: 0.8;
        }

        .achievements-summary {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .achievement-stat {
            background: var(--c-surface);
            backdrop-filter: blur(20px);
            border-radius: var(--r-lg);
            padding: 15px 25px;
            text-align: center;
            border: 1px solid var(--c-line);
        }

        .achievement-stat-value {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .achievement-stat-label {
            font-size: 0.9rem;
            color: var(--c-text-2);
            margin-top: 5px;
        }

        /* ==================== 缁熻鍥捐〃鏍峰紡 ==================== */
        .charts-container {
            margin-bottom: 30px;
        }

        .chart-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: var(--c-surface);
            backdrop-filter: blur(20px);
            border-radius: var(--r-lg);
            padding: 20px;
            border: 1px solid var(--c-line);
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--c-brand);
            margin-bottom: 15px;
            text-align: center;
        }

        .chart-canvas-container {
            position: relative;
            height: 250px;
        }

        /* ==================== 楂樺厜鏃跺埢鏍峰紡 ==================== */
        .highlight-badge {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #6839E8 0%, #0133A4 100%);
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(104, 57, 232, 0.5);
            z-index: 10003;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        @keyframes highlightSlideDown {
            0% { transform: translateX(-50%) translateY(-100px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        @keyframes highlightSlideUp {
            0% { transform: translateX(-50%) translateY(0); opacity: 1; }
            100% { transform: translateX(-50%) translateY(-100px); opacity: 0; }
        }

        .highlight-icon {
            font-size: 2.5rem;
            animation: highlightPulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes highlightPulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        .highlight-text {
            text-align: left;
        }

        .highlight-title {
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 3px;
        }

        .highlight-desc {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .history-highlight-tags {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .history-highlight-tag {
            background: linear-gradient(135deg, #6839E8, #0133A4);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* ==================== 鎺掕姒滄牱寮?==================== */
        .leaderboard-container {
            padding: 20px;
        }

        .leaderboard-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .leaderboard-tab {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            font-weight: 700;
            color: var(--c-text-2);
            transition: all var(--dur-2);
        }

        .leaderboard-tab:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .leaderboard-tab.active {
            background: var(--c-brand);
            color: #000000;
            box-shadow: 0 4px 15px rgba(39, 240, 92, 0.4);
            transform: translateY(-2px);
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .leaderboard-item {
            background: var(--c-surface);
            backdrop-filter: blur(20px);
            border-radius: var(--r-lg);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--c-line);
            transition: all var(--dur-2);
        }

        .leaderboard-item:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 30px rgba(104, 57, 232, 0.15);
        }

        .leaderboard-rank {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            flex-shrink: 0;
        }

        .leaderboard-rank.rank-1 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }

        .leaderboard-rank.rank-2 {
            background: linear-gradient(135deg, #C0C0C0, #A8A8A8);
            color: white;
            box-shadow: 0 4px 20px rgba(192, 192, 192, 0.4);
        }

        .leaderboard-rank.rank-3 {
            background: linear-gradient(135deg, #CD7F32, #8B4513);
            color: white;
            box-shadow: 0 4px 20px rgba(205, 127, 50, 0.4);
        }

        .leaderboard-rank.rank-other {
            background: rgba(104, 57, 232, 0.1);
            color: var(--c-brand);
        }

        .leaderboard-info {
            flex: 1;
        }

        .leaderboard-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--c-brand);
            margin-bottom: 5px;
        }

        .leaderboard-stats {
            font-size: 0.9rem;
            color: var(--c-text-2);
            opacity: 0.8;
        }

        .leaderboard-value {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--c-brand), var(--c-text-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ==================== 澶村儚绯荤粺鏍峰紡 ==================== */
        .avatar-item {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: rgba(104, 57, 232, 0.1);
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .avatar-item:hover {
            transform: scale(1.1);
            border-color: var(--c-brand);
        }

        .avatar-item.selected {
            border-color: var(--c-brand);
            box-shadow: 0 0 15px rgba(39, 240, 92, 0.5);
        }

        .avatar-option {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: rgba(104, 57, 232, 0.1);
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .avatar-option:hover {
            transform: scale(1.1);
            border-color: var(--c-brand);
        }

        .avatar-option.selected {
            border-color: var(--c-brand);
            box-shadow: 0 0 15px rgba(39, 240, 92, 0.5);
        }

        .player-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(104, 57, 232, 0.15);
            border: 2px solid var(--c-line);
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .scoreboard {
                padding: 20px;
                margin-bottom: 15px;
            }

            .score-display {
                margin-bottom: 15px;
            }

            .score {
                font-size: 3rem;
                width: 100px;
                height: 100px;
            }

            .team-name {
                font-size: 1rem;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 5px;
            }
        }
        /* ================================================================
           鍝嶅簲寮忚鍐欓泦涓尯锛埪?.2锛氱粍浠跺彧瀹氫箟涓€娆★紝鍝嶅簲寮忚鍐欏叏閮ㄩ泦涓簬姝わ級
           鏂偣锛?68px锛堝钩鏉匡級/ 480px锛堝ぇ鎵嬫満锛? 360px锛堝皬鎵嬫満锛?
           ================================================================ */

        @media (max-width: 768px) {
            .nav-tabs {
                padding: var(--sp-1);
                margin-bottom: var(--sp-5);
            }

            .nav-tab {
                padding: var(--sp-2) var(--sp-3);
                font-size: var(--fs-xs);
            }
        }

        @media (max-width: 480px) {
            .nav-tab {
                padding: var(--sp-2) var(--sp-2);
                font-size: var(--fs-2xs);
            }
        }

        /* ---- 3b 记分板响应式 ---- */
        @media (max-width: 600px) {
            .scoreboard-main {
                flex-direction: column;
                gap: var(--sp-4);
            }

            .vs-section {
                flex-direction: row;
                padding: 0;
                width: 100%;
                justify-content: center;
            }

            .vs-line {
                width: 60px;
                min-height: 2px;
                height: 2px;
                flex: none;
            }
        }

        @media (max-width: 480px) {
            .scoreboard-wrapper {
                padding: var(--sp-4);
                margin-bottom: var(--sp-5);
            }

            .scoreboard-header {
                padding: var(--sp-2) var(--sp-3);
                margin-bottom: var(--sp-4);
                flex-wrap: wrap;
                gap: var(--sp-2);
            }

            .team-section {
                max-width: 100%;
            }

            .team-avatar {
                width: 44px;
                height: 44px;
                font-size: var(--fs-xl);
            }

            .team-name-input {
                font-size: var(--fs-md);
            }

            .score-circle {
                width: 110px;
            }

            .score-btn {
                width: 44px;
                height: 44px;
                font-size: var(--fs-xl);
            }

            /* 按钮在小屏保留文字（缩短文案而非隐藏），不再 display:none */
            .control-btn .btn-text {
                font-size: var(--fs-2xs);
            }

            .control-btn {
                padding: var(--sp-2) var(--sp-3);
            }

            .mode-chip {
                padding: var(--sp-2) var(--sp-3);
                font-size: var(--fs-xs);
            }
        }

        @media (max-width: 360px) {
            .scoreboard-wrapper {
                padding: var(--sp-3);
            }

            .score-circle {
                width: 96px;
            }

            .score-btn {
                width: 42px;
                height: 42px;
            }

            .control-btn {
                padding: var(--sp-2);
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>缇芥瘺鐞冩瀬閫熻鍒嗘澘<span class="version-badge">涓撲笟鐗?/span></h1>
        </header>

        <ul class="nav-tabs">
            <li class="nav-tab active" data-screen="scoreboard">璁板垎鏉?/li>
            <li class="nav-tab" data-screen="grouping">鏅鸿兘鍒嗙粍</li>
            <li class="nav-tab" data-screen="expense">璐圭敤璁＄畻</li>
            <li class="nav-tab" data-screen="history">鍘嗗彶璁板綍</li>
            <li class="nav-tab" data-screen="leaderboard">鎺掕姒?/li>
            <li class="nav-tab" data-screen="player-ability">鑳藉姏鍒嗘瀽</li>
            <li class="nav-tab" data-screen="achievements">鎴愬氨绯荤粺</li>
            <li class="nav-tab" data-screen="settings">璁剧疆</li>
        </ul>

        <!-- Scoreboard Screen -->
        <div id="scoreboard" class="screen active">
            <div class="scoreboard-wrapper">
                <div class="scoreboard-header">
                    <div class="header-left">
                        <div class="timer-display">
                            <span class="timer-icon">鈴憋笍</span>
                            <span class="timer-value" id="match-timer">00:00</span>
                        </div>
                    </div>
                    <div class="header-center">
                        <div class="game-indicator">
                            <span id="current-game">绗?1 灞€</span>
                        </div>
                    </div>
                    <div class="header-right">
                        <div class="games-score-display">
                            <span class="score-badge" id="games-score-a">0</span>
                            <span class="score-separator">:</span>
                            <span class="score-badge" id="games-score-b">0</span>
                        </div>
                    </div>
                </div>

                <div class="scoreboard-main">
                    <div class="team-section team-a">
                        <div class="team-header">
                            <div class="team-avatar" id="team-a-avatar" onclick="selectAvatar('a')">馃徃</div>
                            <div class="team-name-wrapper">
                                <input type="text" class="team-name-input" id="team-a-name" value="宸辨柟" onclick="this.select()">
                            </div>
                            <div class="games-won-dots" id="team-a-games"></div>
                        </div>
                        <div class="score-circle" id="score-a-circle" onclick="updateScore('a', 1)">
                            <span class="score-number" id="team-a-score">0</span>
                            <span class="score-label">鍒?/span>
                        </div>
                        <div class="score-buttons">
                            <button class="score-btn minus" onclick="updateScore('a', -1)">鈭?/button>
                            <button class="score-btn plus" onclick="updateScore('a', 1)">+</button>
                        </div>
                    </div>

                    <div class="vs-section">
                        <div class="vs-text">VS</div>
                        <div class="vs-line"></div>
                    </div>

                    <div class="team-section team-b">
                        <div class="team-header">
                            <div class="team-avatar" id="team-b-avatar" onclick="selectAvatar('b')">馃徃</div>
                            <div class="team-name-wrapper">
                                <input type="text" class="team-name-input" id="team-b-name" value="瀵规柟" onclick="this.select()">
                            </div>
                            <div class="games-won-dots" id="team-b-games"></div>
                        </div>
                        <div class="score-circle" id="score-b-circle" onclick="updateScore('b', 1)">
                            <span class="score-number" id="team-b-score">0</span>
                            <span class="score-label">鍒?/span>
                        </div>
                        <div class="score-buttons">
                            <button class="score-btn minus" onclick="updateScore('b', -1)">鈭?/button>
                            <button class="score-btn plus" onclick="updateScore('b', 1)">+</button>
                        </div>
                    </div>
                </div>

                <div class="game-mode-section">
                    <div class="mode-label">璧涘埗閫夋嫨</div>
                    <div class="game-mode-chips">
                        <div class="mode-chip active" data-mode="21" onclick="setGameMode(21)">21鍒?/div>
                        <div class="mode-chip" data-mode="15" onclick="setGameMode(15)">15鍒?/div>
                        <div class="mode-chip" data-mode="11" onclick="setGameMode(11)">11鍒?/div>
                        <div class="mode-chip" data-mode="custom" onclick="setGameMode('custom')">鑷畾涔?/div>
                    </div>
                </div>

                <div class="control-buttons">
                    <button class="control-btn secondary" onclick="undoScore()">
                        <span class="btn-icon">鈫╋笍</span>
                        <span class="btn-text">鎾ら攢</span>
                    </button>
                    <button class="control-btn primary" id="timer-button" onclick="toggleTimer()">
                        <span class="btn-icon">鈻讹笍</span>
                        <span class="btn-text">寮€濮嬫瘮璧?/span>
                    </button>
                    <button class="control-btn warning" onclick="endGame()">
                        <span class="btn-icon">馃弫</span>
                        <span class="btn-text">缁撴潫鏈眬</span>
                    </button>
                    <button class="control-btn secondary" onclick="resetMatch()">
                        <span class="btn-icon">馃攧</span>
                        <span class="btn-text">閲嶇疆</span>
                    </button>
                </div>
            </div>

            <!-- Result Form -->
            <div id="result-form" class="result-card" style="display: none;">
                <h2 class="result-title">姣旇禌缁撴灉</h2>
                <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label for="team-a-names">宸辨柟閫夋墜</label>
                        <input type="text" id="team-a-names" placeholder="渚嬪锛氳€佺帇/鑰佸紶">
                    </div>
                    <div style="display: flex; align-items: flex-end; padding-bottom: 24px;">vs</div>
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label for="team-b-names">瀵规柟閫夋墜</label>
                        <input type="text" id="team-b-names" placeholder="渚嬪锛氬皬鏉?灏忛檲">
                    </div>
                </div>
                <div class="control-panel">
                    <button class="btn btn-primary" onclick="saveMatchResult()">淇濆瓨姣旇禌</button>
                    <button class="btn btn-success" onclick="openShareCardModal()">鐢熸垚鍒嗕韩鍗＄墖 鉁?/button>
                    <button class="btn btn-dark" onclick="shareResult()">鍒嗕韩缁撴灉</button>
                </div>
            </div>
        </div>

        /**
         * 璁剧疆涓婚
         * @param {string} theme - 涓婚鍚嶇О
         */
        function setTheme(theme) {
            const html = document.documentElement;
            
            if (theme === 'purple') {
                html.removeAttribute('data-theme');
            } else {
                html.setAttribute('data-theme', theme);
            }
            
            document.querySelectorAll('.theme-card').forEach(btn => {
                btn.classList.remove('active');
            });
            
            const activeBtn = document.querySelector(`.theme-card[data-theme="${theme}"]`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
            
            localStorage.setItem('theme', theme);
            
            if (currentScreen === 'history') {
                destroyCharts();
                setTimeout(() => initCharts(), 100);
            }
        }

        /**
         * 鍔犺浇淇濆瓨鐨勪富棰?
         */
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme && savedTheme !== 'purple') {
                setTheme(savedTheme);
            } else {
                const purpleBtn = document.querySelector('.theme-btn[data-theme="purple"]');
                if (purpleBtn) {
                    purpleBtn.style.borderColor = '#27F05C';
                    purpleBtn.style.transform = 'scale(1.05)';
                    purpleBtn.style.boxShadow = '0 0 20px rgba(39, 240, 92, 0.5)';
                }
            }
        }

        /**
         * 鍒濆鍖栧鑸爣绛?
         */
        function initNavigation() {
            const navTabs = document.querySelectorAll('.nav-tab');
            navTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const screenId = this.getAttribute('data-screen');
                    if (screenId === currentScreen) return;
                    
                    navTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    const currentScreenEl = document.querySelector('.screen.active');
                    const nextScreenEl = document.getElementById(screenId);
                    
                    if (currentScreenEl) {
                        currentScreenEl.classList.add('fade-out');
                        setTimeout(() => {
                            currentScreenEl.classList.remove('active', 'fade-out');
                            nextScreenEl.classList.add('active');
                            currentScreen = screenId;
                            
                            if (screenId === 'history') {
                                setTimeout(() => initCharts(), 100);
                            } else if (screenId === 'leaderboard') {
                                setTimeout(() => renderLeaderboard(), 100);
                            } else if (screenId === 'player-ability') {
                                setTimeout(() => {
                                    initPlayerAbilitySelector();
                                    renderPlayerAbility();
                                }, 100);
                            } else if (screenId === 'achievements') {
                                setTimeout(() => {
                                    renderAchievements();
                                    updateAchievementsSummary();
                                }, 100);
                            }
                        }, 200);
                    } else {
                        nextScreenEl.classList.add('active');
                        currentScreen = screenId;
                    }
                });
            });
        }

        function initServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }).catch(function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            }
        }

        /**
         * 鍒濆鍖栧垎缁勬ā寮忕洃鍚櫒

        /**
         * 鍒囨崲璁℃椂鍣ㄧ姸鎬?
         */
        function toggleTimer() {
            const timerButton = document.getElementById('timer-button');
            if (timerRunning) {
                clearInterval(timerInterval);
                timerButton.innerHTML = '<span class="btn-icon">鈻讹笍</span><span class="btn-text">缁х画姣旇禌</span>';
            } else {
                timerInterval = setInterval(updateTimer, 1000);
                timerButton.innerHTML = '<span class="btn-icon">鈴革笍</span><span class="btn-text">鏆傚仠姣旇禌</span>';
            }
            timerRunning = !timerRunning;
            saveMatchState();
        }

        /**
         * 鏇存柊璁℃椂鍣ㄦ樉绀?
         */
        function updateTimer() {
            seconds++;
            const minutes = Math.floor(seconds / 60);
            const displaySeconds = seconds % 60;
            document.getElementById('match-timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${displaySeconds.toString().padStart(2, '0')}`;
        }

        /**
         * 閲嶇疆璁℃椂鍣?
         */
        function resetTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            timerRunning = false;
            document.getElementById('match-timer').textContent = '00:00';
            document.getElementById('timer-button').innerHTML = '<span class="btn-icon">鈻讹笍</span><span class="btn-text">寮€濮嬫瘮璧?/span>';
        }

        /**
         * 璁剧疆姣旇禌妯″紡
         * @param {number|string} mode - 姣旇禌妯″紡锛?1銆?5銆?1鎴?custom'锛?
         */
        function setGameMode(mode) {
            document.querySelectorAll('.mode-chip').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.mode-chip[data-mode="${mode}"]`).classList.add('active');
            
            gameMode = mode;
            if (mode === 'custom') {
                const customInput = document.getElementById('custom-score');
                targetScore = customInput ? parseInt(customInput.value) || 21 : 21;
                if (!customInput) {
                    const score = prompt('璇疯緭鍏ョ洰鏍囧垎鏁帮細', '21');
                    if (score) {
                        targetScore = parseInt(score) || 21;
                    }
                }
            } else {
                targetScore = mode;
            }
            saveSettings();
        }

        // ==================== 璁板垎鍔熻兘 ====================
        /**
         * 鏇存柊姣斿垎
         * @param {string} team - 闃熶紞鏍囪瘑锛?a'鎴?b'锛?
         * @param {number} amount - 鍒嗘暟鍙樺寲閲?
         */
        function updateScore(team, amount) {
            if (!timerRunning) {
                showNotification('鎻愮ず', '璇峰厛鐐瑰嚮"寮€濮嬫瘮璧?鎸夐挳寮€濮嬭鏃讹紒');
                return;
            }
            
            const oldScore = team === 'a' ? scoreA : scoreB;
            const newScore = Math.max(0, oldScore + amount);
            
            scoreHistory.push({ team, oldScore, newScore, timestamp: Date.now() });
            
            if (team === 'a') {
                scoreA = newScore;
                document.getElementById('team-a-score').textContent = scoreA;
                document.getElementById('score-a-circle').classList.add('pulse');
                setTimeout(() => document.getElementById('score-a-circle').classList.remove('pulse'), 300);
            } else {
                scoreB = newScore;
                document.getElementById('team-b-score').textContent = scoreB;
                document.getElementById('score-b-circle').classList.add('pulse');
                setTimeout(() => document.getElementById('score-b-circle').classList.remove('pulse'), 300);
            }

            playSound(amount > 0 ? 'score' : 'undo');
            vibrate(amount > 0 ? [50] : [30, 30, 30]);
            checkSideChange();
            checkHighlights();
            checkGameEnd();
            saveMatchState();
        }

        /**
         * 鎾ら攢涓婁竴娆″緱鍒?
         */
        function undoScore() {
            if (!timerRunning) {
                showNotification('鎻愮ず', '璇峰厛鐐瑰嚮"寮€濮嬫瘮璧?鎸夐挳寮€濮嬭鏃讹紒');
                return;
            }
            
            if (scoreHistory.length === 0) {
                showNotification('鎻愮ず', '娌℃湁鍙挙閿€鐨勬搷浣?);
                return;
            }
            
            const lastAction = scoreHistory.pop();
            if (lastAction.team === 'a') {
                scoreA = lastAction.oldScore;
                document.getElementById('team-a-score').textContent = scoreA;
            } else {
                scoreB = lastAction.oldScore;
                document.getElementById('team-b-score').textContent = scoreB;
            }
            
            playSound('undo');
            vibrate([30, 30, 30]);
            saveMatchState();
        }

        /**
         * 妫€鏌ユ槸鍚﹂渶瑕佹崲杈?
         */
        function checkSideChange() {
            if (!document.getElementById('side-change-alert').checked) return;
            
            const totalScore = scoreA + scoreB;
            const switchPoint = Math.floor(targetScore / 2) + 1;
            
            if (targetScore === 21 && totalScore === 11) {
                showNotification('鎹㈣竟鎻愰啋', '鍙屾柟寰楀垎涔嬪拰杈惧埌11鍒嗭紝璇蜂氦鎹㈠満鍦帮紒');
            } else if (targetScore === 15 && totalScore === 8) {
                showNotification('鎹㈣竟鎻愰啋', '鍙屾柟寰楀垎涔嬪拰杈惧埌8鍒嗭紝璇蜂氦鎹㈠満鍦帮紒');
            } else if (targetScore === 11 && totalScore === 6) {
                showNotification('鎹㈣竟鎻愰啋', '鍙屾柟寰楀垎涔嬪拰杈惧埌6鍒嗭紝璇蜂氦鎹㈠満鍦帮紒');
            } else if (gameMode === 'custom' && totalScore === switchPoint) {
                showNotification('鎹㈣竟鎻愰啋', `鍙屾柟寰楀垎涔嬪拰杈惧埌${switchPoint}鍒嗭紝璇蜂氦鎹㈠満鍦帮紒`);
            }
        }

        /**
         * 妫€鏌ユ湰灞€鏄惁缁撴潫
         */
        function checkGameEnd() {
            const deuceMode = document.getElementById('deuce-mode').checked;
            let gameEnded = false;
            
            if (deuceMode) {
                if (scoreA >= 30 || scoreB >= 30) {
                    gameEnded = true;
                } else if ((scoreA >= targetScore || scoreB >= targetScore) && Math.abs(scoreA - scoreB) >= 2) {
                    gameEnded = true;
                }
            } else {
                if ((scoreA >= targetScore || scoreB >= targetScore) && Math.abs(scoreA - scoreB) >= 2) {
                    gameEnded = true;
                } else if (scoreA >= targetScore && scoreB >= targetScore) {
                    showNotification('骞冲眬', '鍙屾柟鍚屾椂杈惧埌鐩爣鍒嗘暟锛岃缁х画姣旇禌鐩村埌棰嗗厛2鍒嗭紒');
                }
            }
            
            if (gameEnded) {
                endGame();
            }
        }

        /**
         * 缁撴潫鏈眬
         */
        function endGame() {
            if (!timerRunning && scoreA === 0 && scoreB === 0) {
                showNotification('鎻愮ず', '璇峰厛鐐瑰嚮"寮€濮嬫瘮璧?鎸夐挳寮€濮嬭鏃讹紒');
                return;
            }
            
            let winner = '';
            if (scoreA > scoreB) {
                gamesWonA++;
                winner = document.getElementById('team-a-name').value || '宸辨柟';
                document.getElementById('score-a-circle').classList.add('winner');
            } else if (scoreB > scoreA) {
                gamesWonB++;
                winner = document.getElementById('team-b-name').value || '瀵规柟';
                document.getElementById('score-b-circle').classList.add('winner');
            } else {
                showNotification('骞冲眬', '鍙屾柟姣斿垎鐩稿悓锛岃缁х画姣旇禌锛?);
                return;
            }
            
            gameScoresHistory.push(`${scoreA}-${scoreB}`);
            
            updateGamesWonDisplay();
            
            const bestOfThree = true;
            if (bestOfThree && (gamesWonA >= 2 || gamesWonB >= 2)) {
                if (timerRunning) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    document.getElementById('timer-button').innerHTML = '<span class="btn-icon">鈻讹笍</span><span class="btn-text">寮€濮嬫瘮璧?/span>';
                }
                showNotification('姣旇禌缁撴潫', `${winner} 鑾疯儨锛乗n鏈€缁堟瘮鍒? ${gamesWonA} : ${gamesWonB}`);
                document.getElementById('result-form').style.display = 'block';
                playSound('win');
                setTimeout(() => triggerCelebration(winner), 500);
            } else {
                showNotification('鏈眬缁撴潫', `${winner} 璧㈠緱绗?${currentGame} 灞€锛乗n姣斿垎: ${scoreA} - ${scoreB}`);
                playSound('gameEnd');
                currentGame++;
                document.getElementById('current-game').textContent = `绗?${currentGame} 灞€`;
                resetCurrentGame();
            }
        }

        /**
         * 閲嶇疆褰撳墠灞€姣斿垎

            scoreA = 0;
            scoreB = 0;
            scoreHistory = [];
            document.getElementById('team-a-score').textContent = '0';
            document.getElementById('team-b-score').textContent = '0';
            document.getElementById('score-a-circle').classList.remove('winner');
            document.getElementById('score-b-circle').classList.remove('winner');
            wasLeadingTeamA = null;
            saveMatchState();

        /**
         * 閲嶇疆鏁村満姣旇禌
         */

            const hasProgress = scoreA > 0 || scoreB > 0 || gamesWonA > 0 || gamesWonB > 0 || seconds > 0;
            
            if (hasProgress) {
                const currentScore = `${gamesWonA} : ${gamesWonB}`;
                const gameTime = document.getElementById('match-timer').textContent;
                const message = `纭畾瑕侀噸缃暣鍦烘瘮璧涘悧锛焅n\n褰撳墠姣斿垎锛?{currentScore}\n姣旇禌鏃堕暱锛?{gameTime}\n\n姝ゆ搷浣滀笉鍙挙閿€锛乣;
                
                if (!confirm(message)) return;
            } else {
                if (!confirm('纭畾瑕侀噸缃瘮璧涘悧锛?)) return;
            }
            
            scoreA = 0;
            scoreB = 0;
            gamesWonA = 0;
            gamesWonB = 0;
            currentGame = 1;
            scoreHistory = [];
            gameScoresHistory = [];
            
            document.getElementById('team-a-score').textContent = '0';
            document.getElementById('team-b-score').textContent = '0';
            document.getElementById('score-a-circle').classList.remove('winner');
            document.getElementById('score-b-circle').classList.remove('winner');
            document.getElementById('current-game').textContent = '绗?1 灞€';
            document.getElementById('result-form').style.display = 'none';
            
            updateGamesWonDisplay();
            resetTimer();

            const maxGames = 3;
            let htmlA = '';
            let htmlB = '';

                htmlA += `<div class="game-dot ${i < gamesWonA ? 'won' : ''}"></div>`;

            document.getElementById('team-a-games').innerHTML = htmlA;
            document.getElementById('team-b-games').innerHTML = htmlB;
            
            document.getElementById('games-score-a').textContent = gamesWonA;

         */
        /**

        // ==================== 姣旇禌缁撴灉淇濆瓨 ====================
        /**
         * 淇濆瓨姣旇禌缁撴灉
         */
        function saveMatchResult() {
            const teamANames = document.getElementById('team-a-names').value || teamNameA;
            const teamBNames = document.getElementById('team-b-names').value || teamNameB;
            
            const matchResult = {
                id: Date.now(),
                teamA: teamANames,
                teamB: teamBNames,
                scoreA: gamesWonA,
                scoreB: gamesWonB,
                gameScores: getGameScores(),
                duration: seconds,
                date: new Date().toISOString(),
                mode: gameMode,
                highlights: getHighlightsSummary()
            };
            
            const matchHistory = JSON.parse(localStorage.getItem('matchHistory') || '[]');
            matchHistory.unshift(matchResult);
            localStorage.setItem('matchHistory', JSON.stringify(matchHistory));
            
            const won = gamesWonA > gamesWonB;
            const perfectWin = checkPerfectWin();
            const hadDeuce = checkHadDeuce();
            updateMatchAchievements(won, perfectWin, hadDeuce);
            
            showNotification('淇濆瓨鎴愬姛', '姣旇禌璁板綍宸蹭繚瀛橈紒');
            loadHistory();
            initPlayerAbilitySelector();
            resetMatch();
        }

        /**
         * 妫€鏌ユ槸鍚︽湁闆跺皝鑳滃埄
         */
        function checkPerfectWin() {
            return (scoreA === 0 && scoreB > 0) || (scoreB === 0 && scoreA > 0);
        }

        /**
         * 妫€鏌ユ槸鍚︾粡鍘嗚繃鍔犲垎璧?
         */
        function checkHadDeuce() {
            return scoreA >= 20 && scoreB >= 20;
        }

        /**

        function getGameScores() {
            return gameScoresHistory.join(', ');
        }

        // ==================== 鍘嗗彶璁板綍鍔熻兘 ====================
        /**
         * 鍔犺浇鍘嗗彶璁板綍
         */
        function loadHistory() {
            const matchHistory = JSON.parse(localStorage.getItem('matchHistory') || '[]');
            const historyList = document.getElementById('history-list');
            
            if (matchHistory.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">馃徃</div>
                        <p>鏆傛棤姣旇禌璁板綍</p>
                        <p class="empty-state-hint">寮€濮嬩竴鍦烘瘮璧涘悗浼氳嚜鍔ㄨ褰曞湪杩欓噷</p>
                    </div>`;
                updateStats([]);
                destroyCharts();
                document.getElementById('history-count').textContent = '0 鍦?;
                return;
            }
            
            document.getElementById('history-count').textContent = `${matchHistory.length} 鍦篳;
            
            historyList.innerHTML = matchHistory.slice(0, 20).map((match, index) => {
                const isWin = match.scoreA > match.scoreB;
                const resultClass = isWin ? 'win' : (match.scoreA < match.scoreB ? 'lose' : '');
                const duration = match.duration || 0;
                const minutes = Math.floor(duration / 60);
                const durationText = minutes > 0 ? `${minutes}鍒嗛挓` : '';
                
                return `
                <div class="history-card ${resultClass}" onclick="showMatchDetail(${index})">
                    <div class="history-header">
                        <span class="history-date">${new Date(match.date).toLocaleString()}</span>
                        <span class="history-result">${match.scoreA} : ${match.scoreB}</span>
                    </div>
                    <div class="history-players">${match.teamA} vs ${match.teamB}</div>
                    <div class="history-meta">
                        ${durationText ? `<span>鈴憋笍 ${durationText}</span>` : ''}
                        <span>${isWin ? '鉁?鑳滃埄' : (match.scoreA < match.scoreB ? '鉂?澶辫触' : '馃 骞冲眬')}</span>
                    </div>
                    ${match.highlights && match.highlights.length > 0 ? `
                        <div class="history-highlight-tags">
                            ${match.highlights.map(tag => `<span class="history-highlight-tag">${tag}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `}).join('');
            
            updateStats(matchHistory);
            
            if (currentScreen === 'history') {
                initCharts();
            }
        }

        /**

         * @param {number} index - 姣旇禌璁板綍绱㈠紩

        function shareHistoryMatch(index) {

            const match = matchHistory[index];

                showNotification('閿欒', '鏈壘鍒版瘮璧涜褰?);

            shareCardData = {
                teamA: match.teamA,
                teamB: match.teamB,

                scoreB: match.scoreB,

                duration: durationText,
                date: new Date(match.date).toLocaleDateString('zh-CN'),
                highlights: match.highlights || []
            };
            
            closeMatchDetail();
            renderShareCard();
            document.getElementById('share-card-modal').classList.add('show');

        /**
         * 鏇存柊缁熻鏁版嵁
         * @param {Array} matchHistory - 姣旇禌鍘嗗彶璁板綍
         */
        function updateStats(matchHistory) {
            const totalMatches = matchHistory.length;
            let wins = 0;
            let losses = 0;
            let totalDuration = 0;
            
            matchHistory.forEach(match => {
                if (match.scoreA > match.scoreB) wins++;
                else if (match.scoreA < match.scoreB) losses++;
                totalDuration += match.duration || 0;
            });
            
            document.getElementById('total-matches').textContent = totalMatches;
            document.getElementById('total-wins').textContent = wins;
            document.getElementById('total-losses').textContent = losses;
            document.getElementById('win-rate').textContent = totalMatches > 0 ? 
                Math.round(wins / totalMatches * 100) + '%' : '0%';
            document.getElementById('total-time').textContent = 
                Math.round(totalDuration / 3600) + 'h';
        }

        /**
         * 瀵煎嚭鍘嗗彶璁板綍
         */
        function exportHistory() {
            const matchHistory = JSON.parse(localStorage.getItem('matchHistory') || '[]');
            const dataStr = JSON.stringify(matchHistory, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

        /**
         * 闅忔満鍒嗙粍
         * @param {Array} players - 鐜╁鍒楄〃
         */
        function randomGrouping(players) {
            const shuffled = [...players];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            
            const groups = [];
            for (let i = 0; i < shuffled.length; i += 2) {
                if (i + 1 < shuffled.length) {
                    groups.push([
                        { name: shuffled[i], skill: 3 },
                        { name: shuffled[i + 1], skill: 3 }
                    ]);
                } else {
                    if (groups.length > 0) {
                        groups[groups.length - 1].push({ name: shuffled[i], skill: 3 });
                    }
                }
            }
            return groups;
        }

        /**
         * 瀹炲姏骞宠　鍒嗙粍
         * @param {Array} players - 鐜╁鍒楄〃
         * @param {Array} skills - 瀹炲姏绛夌骇鍒楄〃
         */
        function balancedGrouping(players, skills) {
            if (!skills || skills.length !== players.length) {
                skills = players.map(() => 3);
            }
            
            const playerWithSkill = players.map((p, i) => ({ name: p, skill: skills[i] }));
            playerWithSkill.sort((a, b) => b.skill - a.skill);
            
            const groups = [];
            const used = new Set();
            
            while (used.size < playerWithSkill.length) {
                const available = playerWithSkill.filter((_, i) => !used.has(i));
                if (available.length === 0) break;
                
                const strongest = available[0];
                const strongestIdx = playerWithSkill.findIndex((p, i) => !used.has(i) && p.name === strongest.name);
                used.add(strongestIdx);
                
                const remaining = playerWithSkill.filter((_, i) => !used.has(i));
                if (remaining.length > 0) {
                    const weakest = remaining[remaining.length - 1];
                    const weakestIdx = playerWithSkill.findIndex((p, i) => !used.has(i) && p.name === weakest.name);
                    used.add(weakestIdx);
                    groups.push([
                        { name: strongest.name, skill: strongest.skill },
                        { name: weakest.name, skill: weakest.skill }
                    ]);
                } else {
                    if (groups.length > 0) {
                        groups[groups.length - 1].push({ name: strongest.name, skill: strongest.skill });
                    }
                }
            }
            return groups;
        }

        /**
         * 杞崲璧涘埗鍒嗙粍
         * @param {Array} players - 鐜╁鍒楄〃
         */
        function rotationGrouping(players) {
            const groups = [];
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    groups.push([
                        { name: players[i], skill: 3 },
                        { name: players[j], skill: 3 }
                    ]);
                }
            }
            return groups;
        }
