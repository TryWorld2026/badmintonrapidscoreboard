<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缂囪姤鐦洪悶鍐╃€柅鐔活唶閸掑棙婢?- 娑撴挷绗熼悧?/title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        /* ================================================================
           鐠佹崘顓告禒銈囧鐏?閳?濞ｈ精澹婂鏃€鎸辩€?/ 娴ｆ捁鍋?HUD
           閸忋劍鏋冩禒璺烘暜娑撯偓閸忎浇顔忛崙铏瑰箛鐟?#hex / rgba() 閻ㄥ嫪缍呯純顔衡偓?
           缂佸嫪娆㈢仦鍌氬涧閸忎浇顔忛崘?var(--*)閿涘瞼顩﹀銏ｏ紭閸婄鈧?
           ================================================================ */
        :root {
            /* ---- 鐞涖劑娼伴敍鍫濆枎娑擃厽鈧勭箒閼硅绱濇稉宥囨暏缁绢垶绮﹂敍?--- */
            --c-bg: #0B0E11;          /* 妞ょ敻娼伴張鈧ǎ鍗炵湴 */
            --c-surface: #14181D;     /* 娑撯偓缁狙嶇窗閸楋紕澧?/ 闂堛垺婢?*/
            --c-surface-2: #1C222A;   /* 娴滃瞼楠囬敍姘付娴?/ 閹稿鎸虫惔?*/
            --c-surface-3: #262E38;   /* 娑撳楠囬敍姝╫ver / 濠碘偓濞?*/

            /* ---- 閸欐垳绗ｇ痪鍖＄礄閺囧じ鍞?border閿涘矂浼╅崗宥呭閸濆秶娲呭Ο鈥崇€烽敍?--- */
            --c-line: #232A33;        /* 姒涙顓婚崚鍡涙 */
            --c-line-strong: #38424F; /* 鏉堟挸鍙嗗?/ 閹剙浠?*/

            /* ---- 閺傚洦婀伴敍鍫滅瑝閻劎鍑介惂鏂ょ礉闂勫秳缍嗛崚铏规簜閿?--- */
            --c-text: #F2F5F8;        /* 娑?*/
            --c-text-2: #9AA6B4;      /* 濞嗏槄绱伴弽鍥╊劮 / 鐠囧瓨妲?/ 閸楃姳缍?*/
            --c-text-3: #5F6B7A;      /* 瀵唻绱扮粋浣烘暏 / 瀵邦喗鏁?*/

            /* ---- 闂冪喍绱為懝璇х窗閸忋劌绨查悽銊ユ暜娑撯偓妤傛﹢銈遍崪宀冨 ---- */
            --c-team-a: #FF4D5E;      /* A 闂?閻濆﹦鎲电痪?*/
            --c-team-b: #3D9BFF;      /* B 闂?婢垛晞鎽?*/
            --c-brand: #00E5A0;       /* 閸濅胶澧?/ 鐞涘苯濮?/ 鏉╂稖顢戞稉?*/
            --c-brand-ink: #06281D;   /* 閸濅胶澧濋懝韫瑐閻ㄥ嫭鏋冪€?*/
            --c-gold: #FFC53D;        /* 閹存劕姘?/ 婵傛牜澧?*/

            /* ---- 鐠囶厺绠?---- */
            --c-success: #00E5A0;
            --c-warning: #FFB020;
            --c-danger: #FF4D5E;

            /* ---- 閹烘帞澧?---- */
            --font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC',
                         'HarmonyOS Sans SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --font-num: 'Barlow Condensed', 'Oswald', 'Archivo Narrow',
                        'Arial Narrow', var(--font-sans);
            --fs-2xs: .625rem;  --fs-xs: .75rem;   --fs-sm: .8125rem;  --fs-md: .875rem;
            --fs-base: 1rem;    --fs-lg: 1.125rem; --fs-xl: 1.375rem;  --fs-2xl: 1.75rem;
            --fs-score: clamp(3.25rem, 13vw, 5.5rem);
            --fw-normal: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
            --tracking-tight: -.01em;
            --tracking-wide: .04em;

            /* ---- 缁屾椽妫块敍?px 閸╂椽顣堕敍?--- */
            --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
            --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

            /* ---- 閸﹀棜顫?---- */
            --r-sm: 6px;    /* 鏉堟挸鍙嗗?/ chip / 鐏忓繐绐樼粩?*/
            --r-md: 10px;   /* 閹稿鎸?/ 鐏忓繐宕?*/
            --r-lg: 14px;   /* 閸楋紕澧?/ 闂堛垺婢?*/
            --r-xl: 20px;   /* 濡剝鈧?*/
            --r-full: 999px;

            /* ---- 妤傛ê瀹抽敍鍫熸閼硅弓绗呴梼鏉戝闂団偓閺囨挳鍣搁幍宥呭讲鐟欎緤绱?--- */
            --e-1: 0 1px 2px rgba(0, 0, 0, .40);
            --e-2: 0 2px 8px rgba(0, 0, 0, .45);
            --e-3: 0 8px 24px rgba(0, 0, 0, .55);
            --e-4: 0 16px 48px rgba(0, 0, 0, .65);
            --line-1: inset 0 0 0 1px var(--c-line);
            --line-2: inset 0 0 0 1px var(--c-line-strong);

            /* ---- 閸斻劍鏅?---- */
            --dur-1: 120ms; --dur-2: 200ms; --dur-3: 320ms;
            --ease-out: cubic-bezier(.22, 1, .36, 1);
            --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

            /* ---- 鐏炲倻楠?---- */
            --z-sticky: 100; --z-overlay: 200; --z-modal: 300; --z-toast: 400;
        }

        /* ---- 閸╄櫣顢呯仦?reset ---- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 濠婃艾濮╅弶锛勭矎閺嶅嘲绱￠崠鏍电礄娑撳秴鍟€閸忋劌鐪梾鎰閿涘奔绻氶悾娆愮泊閸斻劎鍤庣槐顫礆 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--c-surface-3);
            border-radius: var(--r-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--c-line-strong);
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: var(--c-surface-3) transparent;
        }

        body {
            font-family: var(--font-sans);
            background: var(--c-bg);
            color: var(--c-text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 閺嬩焦璐伴惃鍕Е娴煎秷澹婂娑樻纯閸忓绱檕pacity 閳?.06閿涘奔绮庨弳妤冦仛濠曟梹鎸辩€广倗浼呴崗澶涚礆 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(60rem 40rem at 12% -10%, rgba(255, 77, 94, 0.06) 0%, transparent 60%),
                radial-gradient(60rem 40rem at 88% -10%, rgba(61, 155, 255, 0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ---- 闁瀚ㄦ稉搴ｅ妽閻?---- */
        ::selection {
            background: rgba(0, 229, 160, 0.28);
            color: var(--c-text);
        }

        :focus-visible {
            outline: 2px solid var(--c-brand);
            outline-offset: 2px;
            border-radius: var(--r-sm);
        }

        /* ---- 閺佹澘鐡ц箛鍛淬€忕粵澶婎啍閿涘牊鐦崚?9閳?0 娑撳秵濮堥崝顭掔礆---- */
        .score-number, .score-label, .timer-value, .games-won-dots,
        .stat-value, .stat-card-value, .leaderboard-score, .expense-amount,
        .ability-stat-value, [class*='number'], [class*='count'] {
            font-variant-numeric: tabular-nums;
            font-feature-settings: 'tnum' 1;
        }

        /* ---- 閸斻劍鏅ラ梽宥囬獓 ---- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: var(--fs-2xl);
            font-weight: var(--fw-bold);
            margin-bottom: var(--sp-3);
            color: var(--c-text);
            letter-spacing: var(--tracking-tight);
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--c-brand);
            border-radius: var(--r-full);
        }

        .version-badge {
            display: inline-block;
            background: var(--c-surface-2);
            color: var(--c-text-2);
            box-shadow: var(--line-1);
            padding: 3px 10px;
            border-radius: var(--r-full);
            font-size: var(--fs-xs);
            font-weight: var(--fw-medium);
            margin-left: var(--sp-2);
            vertical-align: middle;
        }

        footer {
            text-align: center;
            padding: var(--sp-6) var(--sp-5);
            margin-top: var(--sp-5);
        }

        .footer-content {
            display: inline-flex;
            align-items: center;
            gap: var(--sp-2);
            padding: var(--sp-2) var(--sp-5);
            background: var(--c-surface);
            box-shadow: var(--line-1);
            border-radius: var(--r-full);
        }

        .footer-logo {
            font-size: var(--fs-base);
        }

        .footer-text {
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            color: var(--c-text-2);
        }

        .footer-divider {
            color: var(--c-text-3);
        }

        .footer-author {
            font-size: var(--fs-sm);
            font-weight: var(--fw-semibold);
            color: var(--c-text-2);
        }

        .screen {
            display: none;
            animation: fadeIn var(--dur-3) var(--ease-out);
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 妞ょ敻娼伴崚鍥ㄥ床閸斻劎鏁炬晶鐐插繁 */
        .screen.fade-out {
            animation: fadeOut 0.2s ease forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* 缁岃櫣濮搁幀浣风喘閸?*/
        .empty-state-enhanced {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon-animated {
            font-size: 5rem;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(5deg); }
            75% { transform: translateY(-8px) rotate(-5deg); }
        }

        .empty-state-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0133A4;
            margin-bottom: 12px;
        }

        .empty-state-desc {
            font-size: 0.95rem;
            color: #6839E8;
            opacity: 0.7;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .empty-state-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #6839E8 0%, #8B5CF6 100%);
            color: white;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
        }

        .empty-state-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(104, 57, 232, 0.35);
        }

        /* 妤犮劍鐏︾仦蹇撳鏉炶姤鏅ラ弸?*/
        .skeleton {
            background: linear-gradient(90deg, #F0EBFF 25%, #E8E0FF 50%, #F0EBFF 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            height: 100px;
            margin-bottom: 12px;
        }

        .skeleton-text {
            height: 16px;
            margin-bottom: 8px;
        }

        .skeleton-text.short {
            width: 60%;
        }

        /* 閸旂姾娴囬崝銊ф暰 */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(104, 57, 232, 0.2);
            border-top-color: #6839E8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== 鐠佹澘鍨庨弶鎸庣壉瀵?==================== */
        /* ===== 3b 鐠佹澘鍨庨弶?===== */
        .scoreboard-wrapper {
            background: var(--c-surface);
            box-shadow: var(--line-1);
            border-radius: var(--r-xl);
            padding: var(--sp-6);
            margin-bottom: var(--sp-8);
            position: relative;
            overflow: hidden;
        }

        /* 妞ゅ爼鍎?3px 閸濅胶澧濋懝鍙夋蒋 閳?濠曟梹鎸辩€广倛顔囬崚鍡欏閺嶅洩鐦?*/
        .scoreboard-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--c-team-a), var(--c-brand) 50%, var(--c-team-b));
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--sp-3) var(--sp-4);
            background: var(--c-bg);
            border-radius: var(--r-md);
            margin-bottom: var(--sp-5);
        }

        .timer-display {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
        }

        .timer-icon {
            font-size: var(--fs-lg);
        }

        .timer-value {
            font-family: var(--font-num);
            font-size: var(--fs-xl);
            font-weight: var(--fw-semibold);
            color: var(--c-text);
            font-variant-numeric: tabular-nums;
        }

        .game-indicator {
            background: var(--c-surface-3);
            padding: var(--sp-2) var(--sp-4);
            border-radius: var(--r-full);
            font-weight: var(--fw-medium);
            color: var(--c-text-2);
            font-size: var(--fs-sm);
        }

        .games-score-display {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
        }

        .score-badge {
            min-width: 34px;
            height: 34px;
            padding: 0 var(--sp-1);
            background: var(--c-surface-2);
            box-shadow: var(--line-1);
            border-radius: var(--r-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-num);
            font-weight: var(--fw-bold);
            color: var(--c-text);
            font-size: var(--fs-lg);
            font-variant-numeric: tabular-nums;
        }

        #games-score-a { color: var(--c-team-a); }
        #games-score-b { color: var(--c-team-b); }

        .score-separator {
            color: var(--c-text-3);
            font-weight: var(--fw-medium);
        }

        .scoreboard-main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--sp-5);
            margin-bottom: var(--sp-5);
        }

        /* 鍝嶅簲寮忚鍐欏凡闆嗕腑鍒版枃浠舵湯灏剧殑 @media 鍖?*/

        .team-section {
            flex: 1;
            text-align: center;
            max-width: 300px;
            background: var(--c-surface);
            box-shadow: var(--line-1);
            border-radius: var(--r-lg);
            padding: var(--sp-4);
            user-select: none;
        }

        /* 闂冪喍绱炵拠鍡楀焼閿涙岸銆婇柈?3px 閼瑰弶娼敍鍫濆絿娴狅絾鏆ｉ崷鍫㈡鏉?+ 閸嬪繒些閹舵洖濂栭敍?*/
        .team-section.team-a {
            border-top: 3px solid var(--c-team-a);
        }

        .team-section.team-b {
            border-top: 3px solid var(--c-team-b);
        }

        .team-header {
            margin-bottom: var(--sp-4);
        }

        .team-avatar {
            width: 56px;
            height: 56px;
            background: var(--c-surface-2);
            box-shadow: var(--line-1);
            border-radius: var(--r-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--fs-2xl);
            margin: 0 auto var(--sp-2);
            cursor: pointer;
            transition: background var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
        }

        .team-avatar:hover {
            background: var(--c-surface-3);
            transform: scale(1.06);
        }

        .team-name-wrapper {
            margin-bottom: var(--sp-2);
        }

        .team-name-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--c-line);
            color: var(--c-text);
            font-size: var(--fs-lg);
            font-weight: var(--fw-semibold);
            text-align: center;
            width: 100%;
            padding: var(--sp-1) var(--sp-2);
        }

        .team-name-input:focus {
            outline: none;
            border-bottom-color: var(--c-brand);
        }

        .games-won-dots {
            display: flex;
            justify-content: center;
            gap: var(--sp-2);
            min-height: 10px;
            margin-top: var(--sp-2);
        }

        .game-dot {
            width: 10px;
            height: 10px;
            border-radius: var(--r-full);
            background: var(--c-surface-3);
            transition: background var(--dur-2) var(--ease-out);
        }

        .team-a .game-dot.won {
            background: var(--c-team-a);
        }

        .team-b .game-dot.won {
            background: var(--c-team-b);
        }

        /* 濠曟梹鎸辩€广倛顔囬崚鍡欏閺勵垳鐓╄ぐ顫礉娑撳秵妲搁崷?*/
        .score-circle {
            width: clamp(120px, 34vw, 180px);
            aspect-ratio: 3 / 4;
            border-radius: var(--r-lg);
            background: var(--c-surface-2);
            box-shadow: var(--line-1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--sp-4);
            cursor: pointer;
            transition: background var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
            user-select: none;
        }

        .score-circle:hover {
            background: var(--c-surface-3);
            transform: scale(1.03);
        }

        .score-circle:active {
            transform: scale(0.98);
        }

        .score-number {
            font-family: var(--font-num);
            font-size: var(--fs-score);
            font-weight: var(--fw-bold);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: var(--tracking-tight);
        }

        .team-a .score-number { color: var(--c-team-a); }
        .team-b .score-number { color: var(--c-team-b); }

        .score-label {
            font-size: var(--fs-xs);
            color: var(--c-text-3);
            margin-top: var(--sp-1);
        }

            margin-bottom: var(--sp-5);

            color: var(--c-text-3);
            margin-bottom: var(--sp-2);

            justify-content: center;
            gap: var(--sp-2);

            border: none;
            border-radius: var(--r-full);
            color: var(--c-text-2);
            font-weight: var(--fw-medium);
            font-size: var(--fs-sm);
            cursor: pointer;
            transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);

        .mode-chip:hover {
            background: var(--c-surface-3);
            color: var(--c-text);
        }

        .mode-chip.active {
            background: var(--c-brand);
            color: var(--c-brand-ink);
            font-weight: var(--fw-semibold);
        }

        .control-buttons {
            display: flex;
            justify-content: center;
            gap: var(--sp-3);
            flex-wrap: wrap;
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            padding: var(--sp-3) var(--sp-5);
            border: none;
            border-radius: var(--r-md);
            font-family: var(--font-sans);
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            cursor: pointer;
            transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);

        .control-btn.primary {
            background: var(--c-brand);
            color: var(--c-brand-ink);
        }

        .control-btn.primary:hover {
            background: #00FFB3;
        }

        .control-btn.secondary {
            background: var(--c-surface-2);
            color: var(--c-text);
            box-shadow: var(--line-1);
        }

        .control-btn.secondary:hover {
            background: var(--c-surface-3);
        }

        .control-btn.warning {
            background: var(--c-warning);
            color: #3A2600;
        }

        .control-btn.warning:hover {
            background: #FFC44D;
        }

        /* 閼虫粌鍤妯瑰瘨閿涘牆甯?.winner-glow 閺?CSS 鐎规矮绠熼敍灞绢劃婢跺嫪绔撮獮璺虹暰娑斿绱?*/
        .score-circle.winner {
            animation: winnerPulse var(--dur-3) var(--ease-spring);
            box-shadow: var(--line-2), 0 0 0 2px var(--c-team-a), 0 0 24px rgba(255, 77, 94, 0.35);
        }

            box-shadow: var(--line-2), 0 0 0 2px var(--c-team-b), 0 0 24px rgba(61, 155, 255, 0.35);
        }

        .winner-glow {
            box-shadow: var(--line-2), 0 0 0 2px var(--c-team-a), 0 0 24px rgba(255, 77, 94, 0.35);
        }

        @keyframes winnerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        /* ===== 3c 閫氱敤鎺т欢锛氭寜閽?===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--sp-2);
            padding: var(--sp-3) var(--sp-6);
            font-family: var(--font-sans);
            font-size: var(--fs-md);
            font-weight: var(--fw-medium);
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            transition: background var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
            position: relative;
            min-height: 44px;
            text-align: center;
        }

        .btn-primary {
            background: var(--c-brand);
            color: var(--c-brand-ink);
        }

        .btn-primary:hover {
            background: #00FFB3;
        }

        .btn-danger {
            background: var(--c-danger);
            color: #FFFFFF;
        }

        .btn-danger:hover {
            background: #FF7079;
        }

        /* .btn-dark 璇箟鏀逛负 .btn-ghost锛氫腑鎬ч潰 + 鍙戜笣绾?*/

            background: var(--c-surface-2);
            color: var(--c-text);
            box-shadow: var(--line-1);
        }

        .btn-dark:hover {
            background: var(--c-surface-3);
        }

        .btn-success {
            background: var(--c-success);
            color: var(--c-brand-ink);
        }

        }

            padding: var(--sp-2) var(--sp-4);

        }

            min-height: 52px;
        }

        .btn-icon {
            font-size: var(--fs-md);

        }

        .btn-outline {
            background: transparent;
            color: var(--c-text-2);
            box-shadow: var(--line-1);
        }

        .btn-outline:hover {
            background: var(--c-surface-2);
            color: var(--c-text);
        }

        .control-panel {
            display: flex;
            justify-content: center;
            gap: var(--sp-4);
            margin-top: var(--sp-6);
            flex-wrap: wrap;
        }

        /* ===== 3e 弹窗族 ===== */
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--c-surface);
            box-shadow: var(--line-1), var(--e-4);

            animation: popIn var(--dur-3) var(--ease-out);

        }

        .notification.show {
            display: block;
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.92); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .notification h3 {
            font-size: var(--fs-xl);
            margin-bottom: var(--sp-3);
            color: var(--c-text);
            font-weight: var(--fw-semibold);
        }

            font-size: var(--fs-md);
            line-height: 1.6;
        }

        .input-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--c-surface);
            box-shadow: var(--line-1), var(--e-4);
            padding: var(--sp-10) var(--sp-12);
            border-radius: var(--r-xl);
            z-index: var(--z-toast);
            text-align: center;
            animation: popIn var(--dur-3) var(--ease-out);

            from { opacity: 1; }
            to { opacity: 0; }

            to { transform: scale(1); opacity: 1; }

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            transform: translateY(0);

            font-size: 0.85rem;
            color: #0133A4;
            margin-bottom: 5px;

            margin-bottom: 30px;

            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(102, 126, 234, 0.2);
            transition: 0.3s;
            border-radius: 26px;

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;

    <script>
        // ==================== 閸忋劌鐪崣姗€鍣?====================
        let timerInterval = null;
        let seconds = 0;
        let timerRunning = false;
        let scoreA = 0;
        let scoreB = 0;
        let gamesWonA = 0;
        let gamesWonB = 0;
        let currentGame = 1;
        let targetScore = 21;
        let gameMode = 21;
        let scoreHistory = [];
        let gameScoresHistory = [];
        let currentScreen = 'scoreboard';
        let teamNameA = '瀹歌鲸鏌?;
        let teamNameB = '鐎佃鏌?;

        // ==================== 閹存劕姘ㄧ化鑽ょ埠 ====================
        const achievementsList = [
            { id: 'first_match', icon: '棣冨緝', title: '閸掓繃顐奸惂璇叉簚', desc: '鐎瑰本鍨氱粭顑跨閸︾儤鐦挧?, type: 'match', value: 1 },
            { id: 'ten_matches', icon: '棣冨箚', title: '鐏忓繑婀侀幋鎰皑', desc: '鐎瑰本鍨?0閸︾儤鐦挧?, type: 'match', value: 10 },
            { id: 'fifty_matches', icon: '棣冨汲', title: '閻炲啫婧€閼颁礁鐨?, desc: '鐎瑰本鍨?0閸︾儤鐦挧?, type: 'match', value: 50 },
            { id: 'first_win', icon: '棣冨竴', title: '妫ｆ牞鍎?, desc: '鐠с垹绶辩粭顑跨閸︾儤鐦挧?, type: 'win', value: 1 },
            { id: 'ten_wins', icon: '棣冾殟', title: '鐢瓕鍎ㄧ亸鍡楀晽', desc: '鐠с垹绶?0閸︾儤鐦挧?, type: 'win', value: 10 },
            { id: 'twentyfive_wins', icon: '棣冾殞', title: '缂囪棄娼ч悳瀣偓?, desc: '鐠с垹绶?5閸︾儤鐦挧?, type: 'win', value: 25 },
            { id: 'streak_3', icon: '棣冩暉', title: '娑撳绻涢懗?, desc: '鏉╃偟鐢荤挧銏犵繁3閸︾儤鐦挧?, type: 'streak', value: 3 },
            { id: 'streak_5', icon: '棣冩寽', title: '娴滄棁绻涢懗?, desc: '鏉╃偟鐢荤挧銏犵繁5閸︾儤鐦挧?, type: 'streak', value: 5 },
            { id: 'play_hour', icon: '閳存唻绗?, title: '閻炲啰妫?, desc: '缁鳖垵顓搁幍鎾舵倖1鐏忓繑妞?, type: 'duration', value: 3600 },
            { id: 'play_5hours', icon: '閳?, title: '閻炲啰妯?, desc: '缁鳖垵顓搁幍鎾舵倖5鐏忓繑妞?, type: 'duration', value: 18000 },
            { id: 'perfect_win', icon: '閴?, title: '鐎瑰瞼绶ㄩ懗婊冨焺', desc: '娑撯偓鐏炩偓濮ｆ棁绂岄梿璺虹殱鐎佃澧?, type: 'perfect', value: 1 },
            { id: 'deuce_master', icon: '棣冨箖', title: '閸旂姴鍨庣挧娑楃瑩鐎?, desc: '缂佸繐宸?濞嗏€冲閸掑棜绂?, type: 'deuce', value: 3 }
        ];

        let unlockedAchievements = [];
        let totalMatches = 0;
        let totalWins = 0;
        let currentStreak = 0;
        let totalDuration = 0;
        let deuceCount = 0;

        // ==================== 閸掓繂顫愰崠?====================
        document.addEventListener('DOMContentLoaded', function() {
            initNavigation();
            initServiceWorker();
            loadSettings();
            loadMatchState();
            updateGamesWonDisplay();
            loadHistory();
            initWeather();
            loadAchievements();
            initAchievements();
            loadTheme();
            initAvatars();
            initPlayerAbilitySelector();
            initGrouping();
            initExpense();
        });

        /**
         * 閸掓繂顫愰崠鏍у瀻缂佸嫬濮涢懗?
         */
        function initGrouping() {
            const playersTextarea = document.getElementById('players-list');
            if (playersTextarea) {
                playersTextarea.addEventListener('input', function() {
                    updatePlayerCount();
                    updateSkillInputs();
                });
            }
            loadGroupingHistory();
        }

        /**
         * 閸掓繂顫愰崠鏍瀭閻劏顓哥粻妤€濮涢懗?
         */
        function initExpense() {
            const expensePlayers = document.getElementById('expense-players');
            if (expensePlayers) {
                expensePlayers.addEventListener('input', function() {
                    updateParticipantCount();
                    updateRatioInputs();
                });
            }
            loadExpenseHistory();
        }

        /**
         * 鐠佸墽鐤嗘稉濠氼暯
         * @param {string} theme - 娑撳顣介崥宥囆?
         */
        function setTheme(theme) {
            const html = document.documentElement;
            
            if (theme === 'purple') {
                html.removeAttribute('data-theme');
            } else {
                html.setAttribute('data-theme', theme);
            }
            
            document.querySelectorAll('.theme-card').forEach(btn => {
                btn.classList.remove('active');
            });
            
            const activeBtn = document.querySelector(`.theme-card[data-theme="${theme}"]`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
            
            localStorage.setItem('theme', theme);
            
            if (currentScreen === 'history') {
                destroyCharts();
                setTimeout(() => initCharts(), 100);
            }
        }

        /**
         * 閸旂姾娴囨穱婵嗙摠閻ㄥ嫪瀵屾０?
         */
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme && savedTheme !== 'purple') {
                setTheme(savedTheme);
            } else {
                const purpleBtn = document.querySelector('.theme-btn[data-theme="purple"]');
                if (purpleBtn) {
                    purpleBtn.style.borderColor = '#27F05C';
                    purpleBtn.style.transform = 'scale(1.05)';
                    purpleBtn.style.boxShadow = '0 0 20px rgba(39, 240, 92, 0.5)';
                }
            }
        }

        /**
         * 閸掓繂顫愰崠鏍ь嚤閼割亝鐖ｇ粵?
         */
        function initNavigation() {
            const navTabs = document.querySelectorAll('.nav-tab');
            navTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const screenId = this.getAttribute('data-screen');
                    if (screenId === currentScreen) return;
                    
                    navTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    const currentScreenEl = document.querySelector('.screen.active');
                    const nextScreenEl = document.getElementById(screenId);
                    
                    if (currentScreenEl) {
                        currentScreenEl.classList.add('fade-out');
                        setTimeout(() => {
                            currentScreenEl.classList.remove('active', 'fade-out');
                            nextScreenEl.classList.add('active');
                            currentScreen = screenId;
                            
                            if (screenId === 'history') {
                                setTimeout(() => initCharts(), 100);
                            } else if (screenId === 'leaderboard') {
                                setTimeout(() => renderLeaderboard(), 100);
                            } else if (screenId === 'player-ability') {
                                setTimeout(() => {
                                    initPlayerAbilitySelector();
                                    renderPlayerAbility();
                                }, 100);
                            } else if (screenId === 'achievements') {
                                setTimeout(() => {
                                    renderAchievements();
                                    updateAchievementsSummary();
                                }, 100);
                            }
                        }, 200);
                    } else {
                        nextScreenEl.classList.add('active');
                        currentScreen = screenId;
                    }
                });
            });
        }

        /**
         * 閸掓繂顫愰崠鏈rvice Worker
         */
        function initServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }).catch(function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            }
        }

        /**
         * 閸掓繂顫愰崠鏍у瀻缂佸嫭膩瀵繒娲冮崥顒€娅?
         */
        // ==================== 鐠佲剝妞傞崳銊ュ閼?====================
        /**
         * 閸掑洦宕茬拋鈩冩閸ｃ劎濮搁幀?
         */
        function toggleTimer() {
            const timerButton = document.getElementById('timer-button');
            if (timerRunning) {
                clearInterval(timerInterval);
                timerButton.innerHTML = '<span class="btn-icon">閳昏绗?/span><span class="btn-text">缂佈呯敾濮ｆ棁绂?/span>';
            } else {
                timerInterval = setInterval(updateTimer, 1000);
                timerButton.innerHTML = '<span class="btn-icon">閳撮潻绗?/span><span class="btn-text">閺嗗倸浠犲В鏃囩</span>';
            }
            timerRunning = !timerRunning;
            saveMatchState();
        }

        /**
         * 閺囧瓨鏌婄拋鈩冩閸ｃ劍妯夌粈?
         */
        function updateTimer() {
            seconds++;
            const minutes = Math.floor(seconds / 60);
            const displaySeconds = seconds % 60;
            document.getElementById('match-timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${displaySeconds.toString().padStart(2, '0')}`;
        }

        /**
         * 闁插秶鐤嗙拋鈩冩閸?
         */
        function resetTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            timerRunning = false;
            document.getElementById('match-timer').textContent = '00:00';
            document.getElementById('timer-button').innerHTML = '<span class="btn-icon">閳昏绗?/span><span class="btn-text">瀵偓婵鐦挧?/span>';
        }

        // ==================== 濮ｆ棁绂屽Ο鈥崇础鐠佸墽鐤?====================
        /**
         * 鐠佸墽鐤嗗В鏃囩濡€崇础
         * @param {number|string} mode - 濮ｆ棁绂屽Ο鈥崇础閿?1閵?5閵?1閹?custom'閿?
         */
        function setGameMode(mode) {
            document.querySelectorAll('.mode-chip').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.mode-chip[data-mode="${mode}"]`).classList.add('active');
            
            gameMode = mode;
            if (mode === 'custom') {
                const customInput = document.getElementById('custom-score');
                targetScore = customInput ? parseInt(customInput.value) || 21 : 21;
                if (!customInput) {
                    const score = prompt('鐠囩柉绶崗銉ф窗閺嶅洤鍨庨弫甯窗', '21');
                    if (score) {
                        targetScore = parseInt(score) || 21;
                    }
                }
            } else {
                targetScore = mode;
            }
            saveSettings();
        }

        // ==================== 鐠佹澘鍨庨崝鐔诲厴 ====================
        /**
         * 閺囧瓨鏌婂В鏂垮瀻
         * @param {string} team - 闂冪喍绱為弽鍥槕閿?a'閹?b'閿?
         * @param {number} amount - 閸掑棙鏆熼崣妯哄闁?
         */
        function updateScore(team, amount) {
            if (!timerRunning) {
                showNotification('閹绘劗銇?, '鐠囧嘲鍘涢悙鐟板毊"瀵偓婵鐦挧?閹稿鎸冲鈧慨瀣吀閺冭绱?);
                return;
            }
            
            const oldScore = team === 'a' ? scoreA : scoreB;
            const newScore = Math.max(0, oldScore + amount);
            
            scoreHistory.push({ team, oldScore, newScore, timestamp: Date.now() });
            
            if (team === 'a') {
                scoreA = newScore;
                document.getElementById('team-a-score').textContent = scoreA;
                document.getElementById('score-a-circle').classList.add('pulse');
                setTimeout(() => document.getElementById('score-a-circle').classList.remove('pulse'), 300);
            } else {
                scoreB = newScore;
                document.getElementById('team-b-score').textContent = scoreB;
                document.getElementById('score-b-circle').classList.add('pulse');
                setTimeout(() => document.getElementById('score-b-circle').classList.remove('pulse'), 300);
            }

            playSound(amount > 0 ? 'score' : 'undo');
            vibrate(amount > 0 ? [50] : [30, 30, 30]);
            checkSideChange();
            checkHighlights();
            checkGameEnd();
            saveMatchState();
        }

        /**
         * 閹俱倝鏀㈡稉濠佺濞嗏€崇繁閸?
         */
        function undoScore() {
            if (!timerRunning) {
                showNotification('閹绘劗銇?, '鐠囧嘲鍘涢悙鐟板毊"瀵偓婵鐦挧?閹稿鎸冲鈧慨瀣吀閺冭绱?);
                return;
            }
            
            if (scoreHistory.length === 0) {
                showNotification('閹绘劗銇?, '濞屸剝婀侀崣顖涙寵闁库偓閻ㄥ嫭鎼锋担?);
                return;
            }
            
            const lastAction = scoreHistory.pop();
            if (lastAction.team === 'a') {
                scoreA = lastAction.oldScore;
                document.getElementById('team-a-score').textContent = scoreA;
            } else {
                scoreB = lastAction.oldScore;
                document.getElementById('team-b-score').textContent = scoreB;
            }
            
            playSound('undo');
            vibrate([30, 30, 30]);
            saveMatchState();
        }

        /**
         * 濡偓閺屻儲妲搁崥锕傛付鐟曚焦宕叉潏?
         */
        function checkSideChange() {
            if (!document.getElementById('side-change-alert').checked) return;
            
            const totalScore = scoreA + scoreB;
            const switchPoint = Math.floor(targetScore / 2) + 1;
            
            if (targetScore === 21 && totalScore === 11) {
                showNotification('閹广垼绔熼幓鎰板晪', '閸欏本鏌熷妤€鍨庢稊瀣嫲鏉堟儳鍩?1閸掑棴绱濈拠铚傛唉閹广垹婧€閸﹀府绱?);
            } else if (targetScore === 15 && totalScore === 8) {
                showNotification('閹广垼绔熼幓鎰板晪', '閸欏本鏌熷妤€鍨庢稊瀣嫲鏉堟儳鍩?閸掑棴绱濈拠铚傛唉閹广垹婧€閸﹀府绱?);
            } else if (targetScore === 11 && totalScore === 6) {
                showNotification('閹广垼绔熼幓鎰板晪', '閸欏本鏌熷妤€鍨庢稊瀣嫲鏉堟儳鍩?閸掑棴绱濈拠铚傛唉閹广垹婧€閸﹀府绱?);
            } else if (gameMode === 'custom' && totalScore === switchPoint) {
                showNotification('閹广垼绔熼幓鎰板晪', `閸欏本鏌熷妤€鍨庢稊瀣嫲鏉堟儳鍩?{switchPoint}閸掑棴绱濈拠铚傛唉閹广垹婧€閸﹀府绱抈);
            }
        }

        /**
         * 濡偓閺屻儲婀扮仦鈧弰顖氭儊缂佹挻娼?
         */
        function checkGameEnd() {
            const deuceMode = document.getElementById('deuce-mode').checked;
            let gameEnded = false;
            
            if (deuceMode) {
                if (scoreA >= 30 || scoreB >= 30) {
                    gameEnded = true;
                } else if ((scoreA >= targetScore || scoreB >= targetScore) && Math.abs(scoreA - scoreB) >= 2) {
                    gameEnded = true;
                }
            } else {
                if ((scoreA >= targetScore || scoreB >= targetScore) && Math.abs(scoreA - scoreB) >= 2) {
                    gameEnded = true;
                } else if (scoreA >= targetScore && scoreB >= targetScore) {
                    showNotification('楠炲啿鐪?, '閸欏本鏌熼崥灞炬鏉堟儳鍩岄惄顔界垼閸掑棙鏆熼敍宀冾嚞缂佈呯敾濮ｆ棁绂岄惄鏉戝煂妫板棗鍘?閸掑棴绱?);
                }
            }
            
            if (gameEnded) {
                endGame();
            }
        }

        /**
         * 缂佹挻娼張顒€鐪?
         */
        function endGame() {
            if (!timerRunning && scoreA === 0 && scoreB === 0) {
                showNotification('閹绘劗銇?, '鐠囧嘲鍘涢悙鐟板毊"瀵偓婵鐦挧?閹稿鎸冲鈧慨瀣吀閺冭绱?);
                return;
            }
            
            let winner = '';
            if (scoreA > scoreB) {
                gamesWonA++;
                winner = document.getElementById('team-a-name').value || '瀹歌鲸鏌?;
                document.getElementById('score-a-circle').classList.add('winner');
            } else if (scoreB > scoreA) {
                gamesWonB++;
                winner = document.getElementById('team-b-name').value || '鐎佃鏌?;
                document.getElementById('score-b-circle').classList.add('winner');
            } else {
                showNotification('楠炲啿鐪?, '閸欏本鏌熷В鏂垮瀻閻╃鎮撻敍宀冾嚞缂佈呯敾濮ｆ棁绂岄敍?);
                return;
            }
            
            gameScoresHistory.push(`${scoreA}-${scoreB}`);
            
            updateGamesWonDisplay();
            
            const bestOfThree = true;
            if (bestOfThree && (gamesWonA >= 2 || gamesWonB >= 2)) {
                if (timerRunning) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    document.getElementById('timer-button').innerHTML = '<span class="btn-icon">閳昏绗?/span><span class="btn-text">瀵偓婵鐦挧?/span>';
                }
                showNotification('濮ｆ棁绂岀紒鎾存将', `${winner} 閼剧柉鍎ㄩ敍涔梟閺堚偓缂佸牊鐦崚? ${gamesWonA} : ${gamesWonB}`);
                document.getElementById('result-form').style.display = 'block';
                playSound('win');
                setTimeout(() => triggerCelebration(winner), 500);
            } else {
                showNotification('閺堫剙鐪紒鎾存将', `${winner} 鐠с垹绶辩粭?${currentGame} 鐏炩偓閿涗箺n濮ｆ柨鍨? ${scoreA} - ${scoreB}`);
                playSound('gameEnd');
                currentGame++;
                document.getElementById('current-game').textContent = `缁?${currentGame} 鐏炩偓`;
                resetCurrentGame();
            }
        }

        /**
         * 闁插秶鐤嗚ぐ鎾冲鐏炩偓濮ｆ柨鍨?
         */
        function resetCurrentGame() {
            scoreA = 0;
            scoreB = 0;
            scoreHistory = [];
            document.getElementById('team-a-score').textContent = '0';
            document.getElementById('team-b-score').textContent = '0';
            document.getElementById('score-a-circle').classList.remove('winner');
            document.getElementById('score-b-circle').classList.remove('winner');
            wasLeadingTeamA = null;
            saveMatchState();
        }

        /**
         * 闁插秶鐤嗛弫鏉戞簚濮ｆ棁绂?
         */
        function resetMatch() {
            const hasProgress = scoreA > 0 || scoreB > 0 || gamesWonA > 0 || gamesWonB > 0 || seconds > 0;
            
            if (hasProgress) {

            document.getElementById('total-wins').textContent = wins;
            document.getElementById('total-losses').textContent = losses;
            document.getElementById('win-rate').textContent = totalMatches > 0 ?

        /**
         * 闂呭繑婧€閸掑棛绮?
         * @param {Array} players - 閻溾晛顔嶉崚妤勩€?
         */
        function randomGrouping(players) {
            const shuffled = [...players];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            
            const groups = [];
            for (let i = 0; i < shuffled.length; i += 2) {
                if (i + 1 < shuffled.length) {
                    groups.push([
                        { name: shuffled[i], skill: 3 },
                        { name: shuffled[i + 1], skill: 3 }
                    ]);
                } else {
                    if (groups.length > 0) {
                        groups[groups.length - 1].push({ name: shuffled[i], skill: 3 });
                    }
                }
            }
            return groups;
        }

        /**
         * 鐎圭偛濮忛獮瀹犮€€閸掑棛绮?
         * @param {Array} players - 閻溾晛顔嶉崚妤勩€?
         * @param {Array} skills - 鐎圭偛濮忕粵澶岄獓閸掓銆?
         */
        function balancedGrouping(players, skills) {
            if (!skills || skills.length !== players.length) {
                skills = players.map(() => 3);
            }
            
            const playerWithSkill = players.map((p, i) => ({ name: p, skill: skills[i] }));
            playerWithSkill.sort((a, b) => b.skill - a.skill);
            
            const groups = [];
            const used = new Set();
            
            while (used.size < playerWithSkill.length) {
                const available = playerWithSkill.filter((_, i) => !used.has(i));
                if (available.length === 0) break;
                
                const strongest = available[0];
                const strongestIdx = playerWithSkill.findIndex((p, i) => !used.has(i) && p.name === strongest.name);
                used.add(strongestIdx);
                
                const remaining = playerWithSkill.filter((_, i) => !used.has(i));
                if (remaining.length > 0) {
                    const weakest = remaining[remaining.length - 1];
                    const weakestIdx = playerWithSkill.findIndex((p, i) => !used.has(i) && p.name === weakest.name);
                    used.add(weakestIdx);
                    groups.push([
                        { name: strongest.name, skill: strongest.skill },
                        { name: weakest.name, skill: weakest.skill }
                    ]);
                } else {
                    if (groups.length > 0) {
                        groups[groups.length - 1].push({ name: strongest.name, skill: strongest.skill });
                    }
                }
            }
            return groups;
        }

         * 鏉烆喗宕茬挧娑樺煑閸掑棛绮?
         * @param {Array} players - 閻溾晛顔嶉崚妤勩€?
         */
        function rotationGrouping(players) {
            const groups = [];
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    groups.push([
                        { name: players[i], skill: 3 },
                        { name: players[j], skill: 3 }
                    ]);
                }
            }
            return groups;
        }

         * @param {string} type - 闂婅櫕鏅ョ猾璇茬€?
         */
        function playSound(type) {
            if (!document.getElementById('sound-enabled').checked) return;
            
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            const sounds = {
                score: { freq: 800, duration: 0.1 },
                undo: { freq: 400, duration: 0.15 },
                win: { freq: 1000, duration: 0.3 },
                gameEnd: { freq: 600, duration: 0.2 }
            };
            
            const sound = sounds[type] || sounds.score;
            oscillator.frequency.value = sound.freq;
            gainNode.gain.value = 0.3;
            
            oscillator.start();
            setTimeout(() => {
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + sound.duration);
                oscillator.stop(audioContext.currentTime + sound.duration);
            }, sound.duration * 1000);
        }

        /**

        function loadAchievements() {
            const saved = localStorage.getItem('unlockedAchievements');
            if (saved) {
                unlockedAchievements = JSON.parse(saved);
            }
            
            const stats = localStorage.getItem('achievementStats');
            if (stats) {
                const parsed = JSON.parse(stats);
                totalMatches = parsed.totalMatches || 0;
                totalWins = parsed.totalWins || 0;
                currentStreak = parsed.currentStreak || 0;
                totalDuration = parsed.totalDuration || 0;
                deuceCount = parsed.deuceCount || 0;

            const specialContainer = document.getElementById('special-achievements');

                return `

        /**
         * 閺囧瓨鏌婇幋鎰皑缂佺喕顓搁幗妯款洣
         */
        function updateAchievementsSummary() {
            const unlockedCount = unlockedAchievements.length;
            const totalCount = achievementsList.length;
            const progress = Math.round((unlockedCount / totalCount) * 100);
            
            const unlockedEl = document.getElementById('achievements-unlocked');
            const progressEl = document.getElementById('achievements-progress');
            const totalEl = document.getElementById('achievements-total');
            const ringEl = document.getElementById('achievement-progress-ring');
            
            if (unlockedEl) unlockedEl.textContent = unlockedCount;
            if (progressEl) progressEl.textContent = progress + '%';
            if (totalEl) totalEl.textContent = totalCount;
            
            if (ringEl) {
                const circumference = 283;
                const offset = circumference - (progress / 100) * circumference;
                ringEl.style.strokeDashoffset = offset;
            }
        }

         * @param {any} value - 瑜版挸澧犻崐?
         */
        function checkAndUnlockAchievements(type, value) {
            achievementsList.forEach(achievement => {
                if (achievement.type === type && !unlockedAchievements.includes(achievement.id)) {
                    if (value >= achievement.value) {
                        unlockAchievement(achievement);
                    }
                }
            });
        }

            if (unlockedAchievements.includes(achievement.id)) return;
            
            unlockedAchievements.push(achievement.id);
            saveAchievements();
            
            showAchievementBadge(achievement);

            updateAchievementsSummary();

        function updateMatchAchievements(won, perfectWin, hadDeuce) {
            totalMatches++;
            totalDuration += seconds;
            
            if (won) {
                totalWins++;
                currentStreak++;
            } else {
                currentStreak = 0;
            }
            
            if (hadDeuce) {
                deuceCount++;
            }
            
            saveAchievements();
            
            checkAndUnlockAchievements('match', totalMatches);

            checkAndUnlockAchievements('streak', currentStreak);
            checkAndUnlockAchievements('duration', totalDuration);
            checkAndUnlockAchievements('deuce', deuceCount);
            
            if (perfectWin) {

        function createWinRateTrendChart(matchHistory) {
            const ctx = document.getElementById('winRateTrendChart');
            if (!ctx) return;

            if (winRateTrendChart) {
                winRateTrendChart.destroy();
            }

            const sortedHistory = [...matchHistory].reverse();
            let cumulativeWins = 0;
            const winRates = [];
            const labels = [];

                if (match.scoreA > match.scoreB) {
                    cumulativeWins++;
                }
                const winRate = Math.round((cumulativeWins / (index + 1)) * 100);
                winRates.push(winRate);
                labels.push(`#${index + 1}`);
            });

            const recentLabels = labels.slice(-10);
            const recentWinRates = winRates.slice(-10);

            winRateTrendChart = new Chart(ctx, {

        function calculateAllPlayerStats(matchHistory) {
            const playerStats = {};
            
            matchHistory.forEach(match => {
                const playersA = match.teamA.split(/[\/閵嗕箽/).map(p => p.trim());
                const playersB = match.teamB.split(/[\/閵嗕箽/).map(p => p.trim());
                const aWon = match.scoreA > match.scoreB;
                
                [...playersA, ...playersB].forEach(player => {
                    if (!playerStats[player]) {
                        playerStats[player] = { wins: 0, matches: 0, duration: 0 };
                    }
                    playerStats[player].matches++;
                    playerStats[player].duration += match.duration || 0;
                    
                    const won = (playersA.includes(player) && aWon) || (playersB.includes(player) && !aWon);
                    if (won) playerStats[player].wins++;
                });
            });
            
            return playerStats;
        }

        function calculatePlayerRanks(playerName, allPlayerStats) {
            const players = Object.keys(allPlayerStats);
            
            const sortedByWins = [...players].sort((a, b) => allPlayerStats[b].wins - allPlayerStats[a].wins);
            const sortedByMatches = [...players].sort((a, b) => allPlayerStats[b].matches - allPlayerStats[a].matches);
            const sortedByWinRate = [...players].sort((a, b) => {
                const rateA = allPlayerStats[a].matches > 0 ? allPlayerStats[a].wins / allPlayerStats[a].matches : 0;
                const rateB = allPlayerStats[b].matches > 0 ? allPlayerStats[b].wins / allPlayerStats[b].matches : 0;
                return rateB - rateA;
            });
            const sortedByDuration = [...players].sort((a, b) => allPlayerStats[b].duration - allPlayerStats[a].duration);
            
            return {
                wins: sortedByWins.indexOf(playerName) + 1,
                matches: sortedByMatches.indexOf(playerName) + 1,
                winRate: sortedByWinRate.indexOf(playerName) + 1,
                duration: sortedByDuration.indexOf(playerName) + 1
            };
        }

                    playerStats[player].matches++;
                    playerStats[player].duration += match.duration || 0;
                    if (!aWon) playerStats[player].wins++;
                });
            });

            const sortedPlayers = Object.entries(playerStats).map(([name, stats]) => ({
                name,
                ...stats,
                winRate: stats.matches > 0 ? (stats.wins / stats.matches * 100) : 0
            }));

            switch (currentLeaderboardType) {
                case 'wins':
                    sortedPlayers.sort((a, b) => b.wins - a.wins);
                    break;
                case 'matches':
                    sortedPlayers.sort((a, b) => b.matches - a.matches);
                    break;
                case 'winrate':

                    break;

                    switch (currentLeaderboardType) {
                        case 'wins':
                            displayValue = player.wins + '閼?;
                            statsText = `${player.matches}閸?璺?${Math.round(player.winRate)}%`;
                            break;
                        case 'matches':
                            displayValue = player.matches + '閸?;
                            statsText = `${player.wins}閼?璺?${Math.round(player.winRate)}%`;
                            break;
                        case 'winrate':
                            displayValue = Math.round(player.winRate) + '%';
                            statsText = `${player.wins}閼?${player.matches}閸︾;
                            break;
                        case 'duration':
                            const hours = Math.floor(player.duration / 3600);
                            const minutes = Math.floor((player.duration % 3600) / 60);
                            displayValue = hours > 0 ? `${hours}h${minutes}m` : `${minutes}閸掑棝鎸揱;
                            statsText = `${player.matches}閸?璺?${player.wins}閼虫竴;
                            break;
                    }

                    const rank = index + 4;
                    let rankClass = '';

                    return `
                        <div class="leaderboard-item">
                            <div class="leaderboard-rank ${rankClass}">${rank}</div>
                            <div class="leaderboard-info">
                                <div class="player-avatar-small">${getPlayerAvatar(player.name)}</div>
                                <div>
                                    <div class="leaderboard-name">${player.name}</div>
                                    <div style="font-size: 0.8rem; color: #6839E8; opacity: 0.7;">${statsText}</div>
                                </div>
                            </div>
                            <div class="leaderboard-value">${displayValue}</div>
                        </div>
                    `;
                }).join('');
            } else {
                leaderboardList.innerHTML = '<div style="text-align: center; color: #6839E8; opacity: 0.6; padding: 20px;">閺嗗倹妫ら弴鏉戭樋閺佺増宓?/div>';
            }
        }

        /* ==================== 閺傜増澧滃鏇烆嚤閸旂喕鍏?==================== */
        function initOnboarding() {
            const hasSeenOnboarding = localStorage.getItem('hasSeenOnboarding');
            if (!hasSeenOnboarding) {
                showOnboarding();
            }
        }

        function showOnboarding() {
            const overlay = document.createElement('div');
            overlay.className = 'onboarding-overlay';
            overlay.id = 'onboarding-overlay';
            overlay.innerHTML = `
                <div class="onboarding-modal">
                    <div class="onboarding-slides" id="onboarding-slides">
                        <div class="onboarding-slide active">
                            <div class="slide-icon">棣冨緝</div>
                            <h2 class="slide-title">濞嗐垼绻嬫担璺ㄦ暏缂囪姤鐦洪悶鍐╃€柅鐔活吀閸掑棙婢?/h2>
                            <p class="slide-desc">娑撴挷绗熼妴浣虹暆濞蹭降鈧焦鐎柅鐔烘畱缂囪姤鐦洪悶鍐╃槷鐠ф稖顓搁崚鍡椾紣閸?/p>
                        </div>
                        <div class="onboarding-slide">
                            <div class="slide-icon">閳?/div>
                            <h2 class="slide-title">韫囶偊鈧喕顓搁崚?/h2>
                            <p class="slide-desc">閻愮懓鍤径褍娓鹃崷鍫熷灗+閹稿鎸抽崡鍐插讲閸旂姴鍨庨敍灞炬暜閹镐焦鎸欓柨鈧幙宥勭稊</p>
                        </div>
                        <div class="onboarding-slide">
                            <div class="slide-icon">棣冩噧</div>
                            <h2 class="slide-title">閺呴缚鍏橀崚鍡欑矋</h2>
                            <p class="slide-desc">鏉堟挸鍙嗛柅澶嬪閸氬秴宕熼敍宀冨殰閸斻劎鏁撻幋鎰彆楠炲磭娈戠€佃鍨崚鍡欑矋</p>
                        </div>
                        <div class="onboarding-slide">
                            <div class="slide-icon">棣冩尩</div>
                            <h2 class="slide-title">鐠愬湱鏁ら崚鍡樻啞</h2>
                            <p class="slide-desc">閺€顖涘瘮婢舵氨顫掗崚鍡樻啞濡€崇础閿涘矁鍤滈崝銊吀缁犳鐦℃禍鍝勭安娴犳﹢鍣炬０?/p>
                        </div>
                        <div class="onboarding-slide">
                            <div class="slide-icon">棣冩惓</div>
                            <h2 class="slide-title">閺佺増宓佺紒鐔活吀</h2>
                            <p class="slide-desc">閼奉亜濮╃拋鏉跨秿濮ｆ棁绂岄崢鍡楀蕉閿涘瞼鏁撻幋鎰笓鐞涘本顪侀崪灞惧灇鐏?/p>
                        </div>
                        <div class="onboarding-slide">
                            <div class="slide-icon">棣冨竴</div>
                            <h2 class="slide-title">瀵偓婵缍嬫?/h2>
                            <p class="slide-desc">閻愮懓鍤稉瀣煙閹稿鎸抽敍灞界磻閸氼垯缍橀惃鍕獦濮ｆ稓鎮嗙拋鈥冲瀻娑斿姊?/p>
                        </div>
                    </div>
                    <div class="onboarding-dots" id="onboarding-dots"></div>
                    <div class="onboarding-actions">
                        <button class="btn-skip" onclick="skipOnboarding()">鐠哄疇绻?/button>
                        <button class="btn-next" id="btn-next" onclick="nextSlide()">娑撳绔村?/button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            
            createDots();
        }

        let currentSlide = 0;
        const totalSlides = 6;

        function createDots() {
            const dotsContainer = document.getElementById('onboarding-dots');
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            }
        }

        function nextSlide() {
            currentSlide++;
            if (currentSlide >= totalSlides) {
                completeOnboarding();
                return;
            }
            
            const slides = document.querySelectorAll('.onboarding-slide');
            const dots = document.querySelectorAll('.onboarding-dots .dot');
            
            slides.forEach((slide, index) => {
                slide.classList.toggle('active', index === currentSlide);
            });
            
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
            
            if (currentSlide === totalSlides - 1) {
                document.getElementById('btn-next').textContent = '瀵偓婵濞囬悽?;
            }
        }

        function skipOnboarding() {
            completeOnboarding();
        }

        function completeOnboarding() {
            localStorage.setItem('hasSeenOnboarding', 'true');
            const overlay = document.getElementById('onboarding-overlay');
            if (overlay) {
                overlay.classList.add('fade-out');
                setTimeout(() => overlay.remove(), 300);
            }
        }

        /* ==================== 韫囶偅宓庨幙宥勭稊閸旂喕鍏?==================== */
        function showQuickActions() {
            const quickPanel = document.createElement('div');
            quickPanel.className = 'quick-actions-panel';
            quickPanel.id = 'quick-actions-panel';
            quickPanel.innerHTML = `
                <div class="quick-actions-content">
                    <div class="quick-action-item" onclick="quickAction('newMatch')">
                        <span class="quick-icon">棣冨緝</span>
                        <span class="quick-label">閺傜増鐦挧?/span>
                    </div>
                    <div class="quick-action-item" onclick="quickAction('randomTeam')">
                        <span class="quick-icon">棣冨箟</span>
                        <span class="quick-label">闂呭繑婧€閸掑棛绮?/span>
                    </div>
                    <div class="quick-action-item" onclick="quickAction('splitCost')">
                        <span class="quick-icon">棣冩尩</span>
                        <span class="quick-label">鐠愬湱鏁ら崚鍡樻啞</span>
                    </div>
                    <div class="quick-action-item" onclick="quickAction('viewStats')">
                        <span class="quick-icon">棣冩惓</span>
                        <span class="quick-label">閺屻儳婀呯紒鐔活吀</span>
                    </div>
                </div>
            `;
            document.body.appendChild(quickPanel);
            
            setTimeout(() => quickPanel.classList.add('show'), 10);
            
            setTimeout(() => {
                quickPanel.classList.remove('show');
                setTimeout(() => quickPanel.remove(), 300);
            }, 3000);
        }

        function quickAction(action) {
            const panel = document.getElementById('quick-actions-panel');
            if (panel) {
                panel.classList.remove('show');
                setTimeout(() => panel.remove(), 300);
            }
            
            switch(action) {
                case 'newMatch':
                    switchScreen('scoreboard');
                    resetMatch();
                    break;
                case 'randomTeam':
                    switchScreen('grouping');
                    break;
                case 'splitCost':
                    switchScreen('expense');
                    break;
                case 'viewStats':
                    switchScreen('history');
                    break;
            }
        }

        // 閸欏苯鍤仦蹇撶閺勫墽銇氳箛顐ｅ祹閹垮秳缍?
        let lastTap = 0;
        document.addEventListener('touchend', function(e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                    showQuickActions();
                }
            }
            lastTap = currentTime;
        });

        // 妞ょ敻娼伴崝鐘烘祰鐎瑰本鍨氶崥搴″灥婵瀵?
        document.addEventListener('DOMContentLoaded', function() {
            initOnboarding();
        });
    </script>
</body>
</html>
